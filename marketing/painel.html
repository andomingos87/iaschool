<style>

:root[data-theme="dark"] {

  --border: #27326A; --primary: #9DB0FF; --primary-ink: #0F1A3D; --mark: #5A4A12;
  --ok-bg: #12351F; --ok: #7EE0A1; --warn-bg: #3A2E0A; --warn: #FFD25A; --todo-bg: #3D1C10; --todo: #FFA27A;

* { box-sizing: border-box; }
html { scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

.skip:focus { left: 16px; }

/* Topo */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font: 700 17px/1 var(--display); white-space: nowrap; }

.search { flex: 1; max-width: 420px; margin-left: auto; }
.search input { width: 100%; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
.ghost, .menu { height: 38px; min-width: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 600 14px var(--body); cursor: pointer; }
.menu { display: none; }

/* Estrutura */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
nav#side { position: sticky; top: 60px; height: calc(100dvh - 60px); overflow-y: auto; padding: 20px 14px 40px; border-right: 1px solid var(--border); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 4px 16px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 3px 10px; font: 600 12px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.navgroup { margin-top: 14px; }
.navgroup h3 { margin: 0 8px 4px; font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

nav#side a.item:hover { background: var(--surface-2); }
nav#side a.item[aria-current="page"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--primary), 0 1px 2px rgba(15,26,61,.06); font-weight: 600; }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.definido { background: var(--ok); } .dot.parcial { background: var(--part); } .dot.hipotese { background: #D99A00; }
.dot.adefinir { background: var(--todo); } .dot.rascunho { background: var(--info); }
.count { font: 700 11px var(--body); background: var(--todo-bg); color: var(--todo); border-radius: 999px; padding: 1px 7px; }
main { min-width: 0; padding: 28px clamp(16px, 4vw, 56px) 80px; }
main:focus { outline: none; }

/* Selos */
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font: 700 12px var(--body); white-space: nowrap; }
.badge.definido { background: var(--ok-bg); color: var(--ok); } .badge.parcial { background: var(--part-bg); color: var(--part); }
.badge.hipotese { background: var(--warn-bg); color: var(--warn); } .badge.adefinir { background: var(--todo-bg); color: var(--todo); }
.badge.rascunho, .badge.indice, .badge.outro { background: var(--info-bg); color: var(--info); }
strong.st-definido { color: var(--ok); } strong.st-hipotese { color: var(--warn); } strong.st-adefinir { color: var(--todo); }

/* Início */
.hero { padding: 26px 28px; border-radius: 24px; background: var(--tinta); color: #fff; position: relative; overflow: hidden; }
.hero::after { content: "✦"; position: absolute; right: -10px; top: -40px; font-size: 220px; line-height: 1; color: rgba(255,210,90,.14); }
.hero h1 { margin: 0; font: 800 clamp(26px, 4vw, 40px)/1.05 var(--display); letter-spacing: -.02em; }
.hero p { margin: 10px 0 0; color: rgba(255,255,255,.78); max-width: 640px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 20px; position: relative; z-index: 1; }
.stat { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 12px 14px; }
.stat b { display: block; font: 800 26px/1.1 var(--display); color: var(--giz); }
.stat span { font-size: 13px; color: rgba(255,255,255,.75); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 22px 0 8px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); color: var(--text); text-decoration: none; transition: transform .15s, box-shadow .15s; }
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -14px rgba(15,26,61,.35); }
.card small { color: var(--muted); font-size: 12px; }
.card .ct { font: 700 16px/1.25 var(--display); }
.card .pend { font-size: 12px; color: var(--todo); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.crumbs code { font-size: 12px; }
.doc { max-width: 900px; }
.doc h1 { font: 800 clamp(28px, 3.6vw, 40px)/1.08 var(--display); letter-spacing: -.02em; margin: 6px 0 18px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--border); }
th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
a[data-externo]::after { content: " ↗"; font-size: .8em; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); max-width: 900px; }
.pager a { display: flex; flex-direction: column; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; text-decoration: none; background: var(--surface); max-width: 48%; }
.pager a small { color: var(--muted); }
.pager a.next { margin-left: auto; text-align: right; }

.pgroup { margin: 18px 0; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
.pgroup h2 { border: 0; margin: 0 0 8px; padding: 0; font-size: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pitem { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); }
.pitem:first-of-type { border-top: 0; }
.pitem input { margin-top: 5px; width: 17px; height: 17px; accent-color: var(--azul); flex: none; }
.pitem.done span { color: var(--muted); text-decoration: line-through; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 10px 0 4px; color: var(--muted); font-size: 14px; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; flex: 1; min-width: 160px; max-width: 340px; }
.bar i { display: block; height: 100%; background: var(--azul); border-radius: 999px; }

.sim h4 { margin: 0 0 12px; font: 700 17px var(--display); }
.sim-in { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.sim label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
.sim label small { font-weight: 500; color: var(--muted); }
.sim input, .sim select { height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 500 15px var(--body); }
.sim-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 16px; }
.out { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
.out span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.out b { font: 800 21px/1.2 var(--display); }
.out.hl { background: var(--primary); color: var(--primary-ink); }
.out.hl span { color: inherit; opacity: .8; }
.sim .note { font-size: 13px; color: var(--muted); margin: 12px 0 0; max-width: none; }

/* Busca */
.result { display: block; padding: 14px 16px; margin: 10px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; text-decoration: none; color: var(--text); }
.result b { font-family: var(--display); }
.result p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

real A definir Bloqueios para medir 1. Landing não publicada e domínio aiescola.com.br não ligado. 2. Botão de demonstração sem destino real. 3. Nenhum analytics configurado na landing a confirmar . Métricas que viram prova de marketing Só depois de medidas em uso real autorizado: Tempo de revisão por evento. Parte das fotos com sugestão confirmada sem correção. Parte das famílias que abriu o álbum. Até lá, nenhuma delas entra em peça de comunicação. ","pend":["Visita · Visitantes da landing · A verificar: a landing não tem analytics configurado no código · A definir","Interesse · Pedidos de demonstração · Depende de \u003ccode>VITE_DEMO_CONTACT_URL\u003c/code>, ainda sem contato real (\u003ca href=\"../BACKLOG.md\" target=\"_blank\" data-externo=\"1\">BACKLOG\u003c/a>) · A definir","Demo · Demonstrações feitas · Planilha ou CRM (A definir) · A definir","Piloto · Escolas em piloto · Planilha ou CRM · A definir","Cliente · Redes, unidades e alunos contratados; receita (alunos × R$ 6,00 por mês) · Contratos · A definir","Uso · Eventos entregues, álbuns abertos pelas famílias · Dados do produto, depois de liberar foto real · A definir"]},{"id":"01-estrategia--oferta-e-preco","rel":"01-estrategia/oferta-e-preco.md","group":"Estratégia","title":"Oferta e preço","status":{"key":"definido","label":"Definido"},"html":"\u003ch1>Oferta e preço\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Definido em entrevista com a equipe em 31/10/2026. Valores de\ndesconto, cota de artes e mínimo por unidade ainda abertos.\u003c/p>\n\u003ch2>Oferta\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Item\u003c/th>\n\u003cth>Decisão\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Unidade de cobrança\u003c/td>\n\u003ctd>Por aluno, por mês\u003c/td>\n\u003ctd>Definido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Preço de lista\u003c/td>\n\u003ctd>R$ 6,00 por aluno por mês\u003c/td>\n\u003ctd>Definido; validar custo e reação dos contatos\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quem paga\u003c/td>\n\u003ctd>A escola ou a rede\u003c/td>\n\u003ctd>Definido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Artes com IA\u003c/td>\n\u003ctd>Incluídas com cota; acima da cota, pacote extra\u003c/td>\n\u003ctd>Definido; tamanho da cota e preço do pacote \u003cstrong>A definir\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prazo\u003c/td>\n\u003ctd>Mensal por no máximo 3 meses; depois trimestral, semestral ou anual, com desconto maior quanto mais longo\u003c/td>\n\u003ctd>Definido; percentuais \u003cstrong>A definir\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Piloto\u003c/td>\n\u003ctd>Pago com desconto, negociado caso a caso com cada rede\u003c/td>\n\u003ctd>Definido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Entrada dos alunos\u003c/td>\n\u003ctd>Importação por planilha\u003c/td>\n\u003ctd>Definido; ainda não existe no produto\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Quando o piloto começa:\u003c/strong> só depois que o produto puder receber foto real de\naluno (\u003ca href=\"../docs/pendencias-producao.md\" target=\"_blank\" data-externo=\"1\">pendências de produção\u003c/a>). Até lá, a\nconversa com as redes é demonstração com material de teste.\u003c/p>\n\u003ch2>Simulação\u003c/h2>\u003cdiv data-widget=\"simulador\">\u003c/div>\n\u003cp>R$ 6,00 por aluno por mês, sem desconto:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Rede\u003c/th>\n\u003cth>Alunos\u003c/th>\n\u003cth>Por mês\u003c/th>\n\u003cth>Por ano\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>5 unidades de 150 alunos\u003c/td>\n\u003ctd>750\u003c/td>\n\u003ctd>R$ 4.500\u003c/td>\n\u003ctd>R$ 54.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5 unidades de 500 alunos\u003c/td>\n\u003ctd>2.500\u003c/td>\n\u003ctd>R$ 15.000\u003c/td>\n\u003ctd>R$ 180.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10 unidades de 500 alunos\u003c/td>\n\u003ctd>5.000\u003c/td>\n\u003ctd>R$ 30.000\u003c/td>\n\u003ctd>R$ 360.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20 unidades de 1.000 alunos\u003c/td>\n\u003ctd>20.000\u003c/td>\n\u003ctd>R$ 120.000\u003c/td>\n\u003ctd>R$ 1.440.000\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2>Riscos do preço\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Valor por evento.\u003c/strong> São R$ 72 por aluno por ano. Se a rede fizer seis\neventos com foto no ano, dá R$ 12 por aluno por evento. A rede vai comparar\nesse valor com o que gasta hoje com fotógrafo e app; perguntar aos contatos\nquanto é.\u003c/li>\n\u003cli>\u003cstrong>Rede grande.\u003c/strong> Na segunda onda, de 20 a 300 unidades, o valor anual sobe\nrápido. Vai precisar de desconto por volume.\u003c/li>\n\u003cli>\u003cstrong>Custo.\u003c/strong> Já existe estimativa em\n\u003ca href=\"../docs/estimativa-custos-por-aluno.md\" target=\"_blank\" data-externo=\"1\">estimativa de custos por aluno\u003c/a>\n(21/09/2026, preços de lista, sem conta real de cobrança): de R$ 0,11 a\nR$ 1,80 por aluno por mês de plataforma, conforme o número de alunos, e de\nR$ 0,25 a R$ 2,27 com uma arte de IA por evento. A mesma estimativa\nsimulou R$ 5,50 por aluno por mês, com margem de 52% a 90% antes do custo\nde pessoas. A R$ 6,00 a margem fica maior. Ela recomenda um \u003cstrong>mínimo por\nescola\u003c/strong>, porque o custo fixo pesa em unidade pequena, e artes com limite\npor aluno, o que bate com a cota decidida.\u003c/li>\n\u003c/ul>\n\u003ch2>Ainda a definir\u003c/h2>\n\u003col>\n\u003cli>Percentual de desconto para contrato trimestral, semestral e anual.\u003c/li>\n\u003cli>Tamanho da cota de artes (por aluno ou por unidade) e preço do pacote extra.\u003c/li>\n\u003cli>Desconto por volume para redes acima de 20 unidades.\u003c/li>\n\u003cli>Quem conta como aluno na cobrança: todo aluno matriculado (premissa da estimativa de custo) ou só o cadastrado na plataforma.\u003c/li>\n\u003cli>Valor mínimo por unidade, recomendado pela estimativa de custo.\u003c/li>\n\u003cli>Forma de pagamento e nota fiscal.\u003c/li>\n\u003cli>Modelo de contrato de tratamento de dados, que depende da homologação jurídica.\u003c/li>\n\u003cli>Se o preço aparece na landing ou só na proposta.\u003c/li>\n\u003c/ol>\n","text":" Oferta e preço Status: Definido em entrevista com a equipe em 31/10/2026. Valores de desconto, cota de artes e mínimo por unidade ainda abertos. Oferta Item Decisão Status Unidade de cobrança Por aluno, por mês Definido Preço de lista R$ 6,00 por aluno por mês Definido; validar custo e reação dos contatos Quem paga A escola ou a rede Definido Artes com IA Incluídas com cota; acima da cota, pacote extra Definido; tamanho da cota e preço do pacote A definir Prazo Mensal por no máximo 3 meses; depois trimestral, semestral ou anual, com desconto maior quanto mais longo Definido; percentuais A definir Piloto Pago com desconto, negociado caso a caso com cada rede Definido Entrada dos alunos Importação por planilha Definido; ainda não existe no produto Quando o piloto começa: só depois que o produto puder receber foto real de aluno pendências de produção ../../docs/pendencias producao.md . Até lá, a conversa com as redes é demonstração com material de teste. Simulação R$ 6,00 por aluno por mês, sem desconto: Rede Alunos Por mês Por ano 5 unidades de 150 alunos 750 R$ 4.500 R$ 54.000 5 unidades de 500 alunos 2.500 R$ 15.000 R$ 180.000 10 unidades de 500 alunos 5.000 R$ 30.000 R$ 360.000 20 unidades de 1.000 alunos 20.000 R$ 120.000 R$ 1.440.000 Riscos do preço Valor por evento. São R$ 72 por aluno por ano. Se a rede fizer seis eventos com foto no ano, dá R$ 12 por aluno por evento. A rede vai comparar esse valor com o que gasta hoje com fotógrafo e app; perguntar aos contatos quanto é. Rede grande. Na segunda onda, de 20 a 300 unidades, o valor anual sobe rápido. Vai precisar de desconto por volume. Custo. Já existe estimativa em estimativa de custos por aluno ../../docs/estimativa custos por aluno.md 21/09/2026, preços de lista, sem conta real de cobrança : de R$ 0,11 a R$ 1,80 por aluno por mês de plataforma, conforme o número de alunos, e de R$ 0,25 a R$ 2,27 com uma arte de IA por evento. A mesma estimativa simulou R$ 5,50 por aluno por mês, com margem de 52% a 90% antes do custo de pessoas. A R$ 6,00 a margem fica maior. Ela recomenda um mínimo por escola , porque o custo fixo pesa em unidade pequena, e artes com limite por aluno, o que bate com a cota decidida. Ainda a definir 1. Percentual de desconto para contrato trimestral, semestral e anual. 2. Tamanho da cota de artes por aluno ou por unidade e preço do pacote extra. 3. Desconto por volume para redes acima de 20 unidades. 4. Quem conta como aluno na cobrança: todo aluno matriculado premissa da estimativa de custo ou só o cadastrado na plataforma. 5. Valor mínimo por unidade, recomendado pela estimativa de custo. 6. Forma de pagamento e nota fiscal. 7. Modelo de contrato de tratamento de dados, que depende da homologação jurídica. 8. Se o preço aparece na landing ou só na proposta. ","pend":["Artes com IA · Incluídas com cota; acima da cota, pacote extra · Definido; tamanho da cota e preço do pacote \u003cstrong>A definir\u003c/strong>","Prazo · Mensal por no máximo 3 meses; depois trimestral, semestral ou anual, com desconto maior quanto mais longo · Definido; percentuais \u003cstrong>A definir\u003c/strong>","Percentual de desconto para contrato trimestral, semestral e anual.","Tamanho da cota de artes (por aluno ou por unidade) e preço do pacote extra.","Desconto por volume para redes acima de 20 unidades.","Quem conta como aluno na cobrança: todo aluno matriculado (premissa da estimativa de custo) ou só o cadastrado na plataforma.","Valor mínimo por unidade, recomendado pela estimativa de custo.","Forma de pagamento e nota fiscal.","Modelo de contrato de tratamento de dados, que depende da homologação jurídica.","Se o preço aparece na landing ou só na proposta."]},{"id":"01-estrategia--personas","rel":"01-estrategia/personas.md","group":"Estratégia","title":"Personas","status":{"key":"hipotese","label":"Hipótese"},"html":"\u003ch1>Personas\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Hipótese. Base: \u003ca href=\"../docs/pivotagem-iaschool.md\" target=\"_blank\" data-externo=\"1\">pivotagem, §3.3\u003c/a>,\nseção &quot;Para quem&quot; da landing e demonstrações gravadas em \u003ccode>videos/\u003c/code>. Atualizar\ndepois de cada entrevista.\u003c/p>\n\u003cp>Cada persona tem o mesmo formato para facilitar a comparação.\u003c/p>\n\u003ch2>1. Dono ou diretor(a) da rede\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Papel na compra:\u003c/strong> decide e assina. Confirmado na entrevista de 31/10/2026.\u003c/li>\n\u003cli>\u003cstrong>Quer:\u003c/strong> escola com boa imagem perante as famílias, sem risco com foto de aluno.\u003c/li>\n\u003cli>\u003cstrong>Dor:\u003c/strong> reclamação de família, autorização em papel que ninguém acha, foto no grupo errado.\u003c/li>\n\u003cli>\u003cstrong>Medo:\u003c/strong> problema jurídico ou na imprensa por causa de imagem de criança.\u003c/li>\n\u003cli>\u003cstrong>Precisa ver:\u003c/strong> quem autorizou, o que foi enviado e para quem; custo.\u003c/li>\n\u003cli>\u003cstrong>Objeção provável:\u003c/strong> &quot;reconhecimento facial de criança vai dar problema&quot;.\u003c/li>\n\u003cli>\u003cstrong>Onde se informa:\u003c/strong> A definir.\u003c/li>\n\u003c/ul>\n\u003ch2>2. Coordenação ou comunicação (da rede ou da unidade)\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Papel na compra:\u003c/strong> usuária principal e quem defende a compra lá dentro. Na\nrede, pode haver comunicação central e uma pessoa por unidade.\u003c/li>\n\u003cli>\u003cstrong>Quer:\u003c/strong> entregar as fotos do evento rápido e sem retrabalho.\u003c/li>\n\u003cli>\u003cstrong>Dor:\u003c/strong> horas abrindo foto por foto; famílias pedindo a foto do filho.\u003c/li>\n\u003cli>\u003cstrong>Precisa ver:\u003c/strong> o upload do evento inteiro e a fila de revisão funcionando.\u003c/li>\n\u003cli>\u003cstrong>Objeção provável:\u003c/strong> &quot;vou ter que cadastrar aluno por aluno?&quot;. Resposta\ndecidida: importação por planilha, ainda não construída.\u003c/li>\n\u003cli>\u003cstrong>Onde se informa:\u003c/strong> A definir.\u003c/li>\n\u003c/ul>\n\u003ch2>3. Secretaria\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Papel na compra:\u003c/strong> opera cadastro de alunos, responsáveis e autorizações.\u003c/li>\n\u003cli>\u003cstrong>Quer:\u003c/strong> cadastro simples, poucos cliques.\u003c/li>\n\u003cli>\u003cstrong>Dor:\u003c/strong> controlar autorizações de imagem em papel ou planilha.\u003c/li>\n\u003cli>\u003cstrong>Precisa ver:\u003c/strong> cadastro e pedido de autorização ao responsável.\u003c/li>\n\u003c/ul>\n\u003ch2>4. Professor(a)\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Papel na compra:\u003c/strong> influencia pouco, mas pode subir fotos e sentir o ganho.\u003c/li>\n\u003cli>\u003cstrong>Quer:\u003c/strong> &quot;subir as fotos do meu evento&quot; e pronto.\u003c/li>\n\u003cli>\u003cstrong>Precisa ver:\u003c/strong> que não vai ganhar trabalho novo.\u003c/li>\n\u003c/ul>\n\u003ch2>5. Responsável (família)\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Papel na compra:\u003c/strong> não paga, mas a satisfação dele é o que a escola compra.\u003c/li>\n\u003cli>\u003cstrong>Quer:\u003c/strong> as fotos do filho, fácil de achar e baixar.\u003c/li>\n\u003cli>\u003cstrong>Dor:\u003c/strong> procurar o filho entre centenas de fotos; ver foto do filho exposta para todo mundo.\u003c/li>\n\u003cli>\u003cstrong>Precisa ver:\u003c/strong> o que autorizou, como retira a autorização, onde estão as fotos.\u003c/li>\n\u003cli>\u003cstrong>Pergunta provável:\u003c/strong> &quot;outras crianças aparecem nas fotos que recebo?&quot; e &quot;e se eu não autorizar?&quot;.\u003c/li>\n\u003c/ul>\n\u003ch2>6. Quem pode travar: jurídico, DPO ou TI da escola ou da rede\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Papel na compra:\u003c/strong> pode vetar.\u003c/li>\n\u003cli>\u003cstrong>Quer:\u003c/strong> base legal, contrato de tratamento de dados, retenção, exclusão.\u003c/li>\n\u003cli>\u003cstrong>Precisa ver:\u003c/strong> como a autorização é registrada e revogada, onde os dados ficam, por quanto tempo.\u003c/li>\n\u003cli>\u003cstrong>Risco para a venda:\u003c/strong> a homologação jurídica do produto ainda está pendente\n(\u003ca href=\"../docs/pendencias-producao.md\" target=\"_blank\" data-externo=\"1\">pendências de produção\u003c/a>, item 5).\nNão prometer o que não foi homologado.\u003c/li>\n\u003c/ul>\n\u003ch2>A definir depois das entrevistas\u003c/h2>\n\u003cul>\n\u003cli>Canais onde cada persona se informa.\u003c/li>\n\u003cli>Quem opera no dia a dia numa rede: comunicação central ou cada unidade.\u003c/li>\n\u003cli>Peso do responsável na decisão da escola.\u003c/li>\n\u003c/ul>\n","text":" Personas Status: Hipótese. Base: pivotagem, §3.3 ../../docs/pivotagem iaschool.md , seção \"Para quem\" da landing e demonstrações gravadas em videos/ . Atualizar depois de cada entrevista. Cada persona tem o mesmo formato para facilitar a comparação. 1. Dono ou diretor a da rede Papel na compra: decide e assina. Confirmado na entrevista de 31/10/2026. Quer: escola com boa imagem perante as famílias, sem risco com foto de aluno. Dor: reclamação de família, autorização em papel que ninguém acha, foto no grupo errado. Medo: problema jurídico ou na imprensa por causa de imagem de criança. Precisa ver: quem autorizou, o que foi enviado e para quem; custo. Objeção provável: \"reconhecimento facial de criança vai dar problema\". Onde se informa: A definir. 2. Coordenação ou comunicação da rede ou da unidade Papel na compra: usuária principal e quem defende a compra lá dentro. Na rede, pode haver comunicação central e uma pessoa por unidade. Quer: entregar as fotos do evento rápido e sem retrabalho. Dor: horas abrindo foto por foto; famílias pedindo a foto do filho. Precisa ver: o upload do evento inteiro e a fila de revisão funcionando. Objeção provável: \"vou ter que cadastrar aluno por aluno?\". Resposta decidida: importação por planilha, ainda não construída. Onde se informa: A definir. 3. Secretaria Papel na compra: opera cadastro de alunos, responsáveis e autorizações. Quer: cadastro simples, poucos cliques. Dor: controlar autorizações de imagem em papel ou planilha. Precisa ver: cadastro e pedido de autorização ao responsável. 4. Professor a Papel na compra: influencia pouco, mas pode subir fotos e sentir o ganho. Quer: \"subir as fotos do meu evento\" e pronto. Precisa ver: que não vai ganhar trabalho novo. 5. Responsável família Papel na compra: não paga, mas a satisfação dele é o que a escola compra. Quer: as fotos do filho, fácil de achar e baixar. Dor: procurar o filho entre centenas de fotos; ver foto do filho exposta para todo mundo. Precisa ver: o que autorizou, como retira a autorização, onde estão as fotos. Pergunta provável: \"outras crianças aparecem nas fotos que recebo?\" e \"e se eu não autorizar?\". 6. Quem pode travar: jurídico, DPO ou TI da escola ou da rede Papel na compra: pode vetar. Quer: base legal, contrato de tratamento de dados, retenção, exclusão. Precisa ver: como a autorização é registrada e revogada, onde os dados ficam, por quanto tempo. Risco para a venda: a homologação jurídica do produto ainda está pendente pendências de produção ../../docs/pendencias producao.md , item 5 . Não prometer o que não foi homologado. A definir depois das entrevistas Canais onde cada persona se informa. Quem opera no dia a dia numa rede: comunicação central ou cada unidade. Peso do responsável na decisão da escola. ","pend":["\u003cstrong>Onde se informa:\u003c/strong> A definir.","Canais onde cada persona se informa.","Quem opera no dia a dia numa rede: comunicação central ou cada unidade.","Peso do responsável na decisão da escola."]},{"id":"01-estrategia--posicionamento","rel":"01-estrategia/posicionamento.md","group":"Estratégia","title":"Posicionamento","status":{"key":"hipotese","label":"Hipótese"},"html":"\u003ch1>Posicionamento\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Hipótese. Base: landing atual e fluxo do produto. Validar nas\n\u003ca href=\"#06-pesquisa--roteiro-entrevista\">entrevistas\u003c/a>.\u003c/p>\n\u003ch2>Categoria\u003c/h2>\n\u003cp>Plataforma de entrega de fotos de eventos escolares às famílias, com separação\npor aluno e autorização do responsável.\u003c/p>\n\u003cp>O reconhecimento facial é o meio. A promessa é a foto certa chegar à família\ncerta, com a autorização registrada. Liderar com &quot;reconhecimento facial de\ncriança&quot; assusta o comprador antes de ele entender o benefício.\u003c/p>\n\u003ch2>Frase de posicionamento (rascunho)\u003c/h2>\n\u003cblockquote>\n\u003cp>Para redes de escolas particulares que fazem eventos com fotos e hoje entregam\npor pasta aberta ou rede social, a AIESCOLA separa as fotos por aluno e\nentrega a cada família só as fotos do seu filho. Diferente de Drive, rede\nsocial ou fotógrafo terceirizado, a escola sabe quem autorizou, o que foi\nenviado e para quem.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Proposta de valor por persona\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Persona\u003c/th>\n\u003cth>Dor hoje\u003c/th>\n\u003cth>Ganho\u003c/th>\n\u003cth>O que no produto sustenta\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Direção\u003c/td>\n\u003ctd>Foto no grupo errado, reclamação de família, autorização em papel\u003c/td>\n\u003ctd>Registro de autorização e de cada entrega\u003c/td>\n\u003ctd>Autorização por finalidade, trilha de auditoria\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Coordenação e comunicação\u003c/td>\n\u003ctd>Horas separando foto por aluno\u003c/td>\n\u003ctd>Sobe o evento inteiro e só revisa sugestões\u003c/td>\n\u003ctd>Upload em lote, fila de revisão\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Família\u003c/td>\n\u003ctd>Procura o filho entre centenas de fotos\u003c/td>\n\u003ctd>Recebe só as fotos do filho, sem instalar app\u003c/td>\n\u003ctd>Álbum por link, download em ZIP\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2>Mensagens-chave\u003c/h2>\n\u003cp>Já usadas na landing e coerentes com o produto:\u003c/p>\n\u003col>\n\u003cli>Cada família recebe as fotos do seu filho.\u003c/li>\n\u003cli>A IA sugere, a escola confere: nada vai para a família sem revisão.\u003c/li>\n\u003cli>A autorização do responsável é separada por finalidade, registrada e pode ser retirada.\u003c/li>\n\u003cli>A família não instala nada: abre o link e baixa.\u003c/li>\n\u003c/ol>\n\u003ch2>Diferenciais\u003c/h2>\n\u003cp>\u003cstrong>Pode usar\u003c/strong> (existe no código): revisão humana antes da entrega, autorização\npor finalidade, link exclusivo por família, trilha de aprovações e envios,\nartes com IA a partir do modelo da escola.\u003c/p>\n\u003cp>\u003cstrong>Ainda não pode usar\u003c/strong> (sem medição ou sem publicação): velocidade (&quot;em\nminutos&quot;), volume (&quot;5.000 fotos&quot;), precisão do reconhecimento, álbum agrupado\npor evento. Detalhes em \u003ca href=\"#07-conformidade--regras-de-comunicacao\">regras de comunicação\u003c/a>.\u003c/p>\n\u003ch2>Artes com IA: recurso secundário\u003c/h2>\n\u003cp>\u003cstrong>Hipótese:\u003c/strong> as artes entram como recurso extra, não como promessa principal.\nA dor da entrega é mais clara, e arte de IA com rosto de aluno gera mais\nobjeção. Validar nas entrevistas se a arte ajuda ou atrapalha a venda.\u003c/p>\n\u003ch2>A definir\u003c/h2>\n\u003cul>\n\u003cli>Slogan oficial. O PDF de aplicações da marca deixa &quot;[Slogan a definir]&quot;. A\nlinha do rodapé da landing, &quot;Fotos da escola, entregues a cada família.&quot;, é\ncandidata.\u003c/li>\n\u003c/ul>\n","text":" Posicionamento Status: Hipótese. Base: landing atual e fluxo do produto. Validar nas entrevistas ../06 pesquisa/roteiro entrevista.md . Categoria Plataforma de entrega de fotos de eventos escolares às famílias, com separação por aluno e autorização do responsável. O reconhecimento facial é o meio. A promessa é a foto certa chegar à família certa, com a autorização registrada. Liderar com \"reconhecimento facial de criança\" assusta o comprador antes de ele entender o benefício. Frase de posicionamento rascunho Para redes de escolas particulares que fazem eventos com fotos e hoje entregam por pasta aberta ou rede social, a AIESCOLA separa as fotos por aluno e entrega a cada família só as fotos do seu filho. Diferente de Drive, rede social ou fotógrafo terceirizado, a escola sabe quem autorizou, o que foi enviado e para quem. Proposta de valor por persona Persona Dor hoje Ganho O que no produto sustenta Direção Foto no grupo errado, reclamação de família, autorização em papel Registro de autorização e de cada entrega Autorização por finalidade, trilha de auditoria Coordenação e comunicação Horas separando foto por aluno Sobe o evento inteiro e só revisa sugestões Upload em lote, fila de revisão Família Procura o filho entre centenas de fotos Recebe só as fotos do filho, sem instalar app Álbum por link, download em ZIP Mensagens chave Já usadas na landing e coerentes com o produto: 1. Cada família recebe as fotos do seu filho. 2. A IA sugere, a escola confere: nada vai para a família sem revisão. 3. A autorização do responsável é separada por finalidade, registrada e pode ser retirada. 4. A família não instala nada: abre o link e baixa. Diferenciais Pode usar existe no código : revisão humana antes da entrega, autorização por finalidade, link exclusivo por família, trilha de aprovações e envios, artes com IA a partir do modelo da escola. Ainda não pode usar sem medição ou sem publicação : velocidade \"em minutos\" , volume \"5.000 fotos\" , precisão do reconhecimento, álbum agrupado por evento. Detalhes em regras de comunicação ../07 conformidade/regras de comunicacao.md . Artes com IA: recurso secundário Hipótese: as artes entram como recurso extra, não como promessa principal. A dor da entrega é mais clara, e arte de IA com rosto de aluno gera mais objeção. Validar nas entrevistas se a arte ajuda ou atrapalha a venda. A definir Slogan oficial. O PDF de aplicações da marca deixa \" Slogan a definir \". A linha do rodapé da landing, \"Fotos da escola, entregues a cada família.\", é candidata. ","pend":["Slogan oficial. O PDF de aplicações da marca deixa &quot;[Slogan a definir]&quot;. A linha do rodapé da landing, &quot;Fotos da escola, entregues a cada família.&quot;, é candidata."]},{"id":"01-estrategia--publico-e-icp","rel":"01-estrategia/publico-e-icp.md","group":"Estratégia","title":"Público e perfil de escola ideal (ICP)","status":{"key":"definido","label":"Definido"},"html":"\u003ch1>Público e perfil de escola ideal (ICP)\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Definido em entrevista com a equipe em 31/10/2026. Os pontos ainda\nabertos estão marcados.\u003c/p>\n\u003cp>Persona descreve pessoas. ICP descreve quem compra. Aqui quem compra é a rede:\nquem assina não é quem usa, e quem sente o resultado (a família) não paga.\u003c/p>\n\u003ch2>ICP do primeiro contrato\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Critério\u003c/th>\n\u003cth>Decisão\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Tipo\u003c/td>\n\u003ctd>Rede particular com várias unidades\u003c/td>\n\u003ctd>Definido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tamanho da rede\u003c/td>\n\u003ctd>5 a 20 unidades\u003c/td>\n\u003ctd>Definido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Porte por unidade\u003c/td>\n\u003ctd>Varia de 150 a 2.000 alunos\u003c/td>\n\u003ctd>Definido (informação dos contatos)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Etapas\u003c/td>\n\u003ctd>Educação infantil ao ensino médio\u003c/td>\n\u003ctd>Definido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Região\u003c/td>\n\u003ctd>Guarulhos e São Paulo\u003c/td>\n\u003ctd>Definido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quem decide\u003c/td>\n\u003ctd>Dono ou diretor(a) da rede\u003c/td>\n\u003ctd>Definido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Como entrega fotos hoje\u003c/td>\n\u003ctd>Drive ou Google Fotos, rede social da escola, fotógrafo ou app escolar\u003c/td>\n\u003ctd>Definido (informação dos contatos)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Acesso\u003c/td>\n\u003ctd>Relação próxima com várias redes da região\u003c/td>\n\u003ctd>Definido\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2>Por que rede\u003c/h2>\n\u003cul>\n\u003cli>A equipe tem relação próxima com várias redes: a primeira venda é por relacionamento, não por anúncio.\u003c/li>\n\u003cli>Um contrato cobre várias unidades.\u003c/li>\n\u003cli>O piloto em poucas unidades vira caso para o resto da rede e para outras redes.\u003c/li>\n\u003c/ul>\n\u003ch2>Segunda onda: redes de 20 a 300 unidades\u003c/h2>\n\u003cp>Os contatos incluem redes de até 300 unidades. Elas ficam para depois do\nprimeiro contrato e dos pré-requisitos abaixo, porque exigem compra formal,\njurídico, TI e volume que o produto ainda não comprovou.\u003c/p>\n\u003ch2>Pré-requisitos de produto para este ICP\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Pré-requisito\u003c/th>\n\u003cth>Situação hoje\u003c/th>\n\u003cth>Por que trava\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Importação de alunos e responsáveis por planilha\u003c/td>\n\u003ctd>Decidida em 31/10/2026, não construída. Hoje o cadastro é aluno por aluno\u003c/td>\n\u003ctd>Rede de 5 unidades com 500 alunos cada tem 2.500 alunos\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Autorização e entrega em escala\u003c/td>\n\u003ctd>O link de autorização só sai pelo WhatsApp (\u003ccode>artifacts/iaschool-app/supabase/functions/request-guardian-consent/index.ts:5-6\u003c/code>). O envio comercial está desligado e o adaptador da Meta não existe\u003c/td>\n\u003ctd>Sem isso nenhuma família autoriza nem recebe fotos\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Foto real de aluno liberada\u003c/td>\n\u003ctd>Gates abertos em \u003ca href=\"../docs/pendencias-producao.md\" target=\"_blank\" data-externo=\"1\">pendências de produção\u003c/a>\u003c/td>\n\u003ctd>O piloto pago depende disso\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Homologação jurídica e contrato de dados\u003c/td>\n\u003ctd>Pendente (\u003ca href=\"../docs/pendencias-producao.md\" target=\"_blank\" data-externo=\"1\">pendências\u003c/a>, item 5)\u003c/td>\n\u003ctd>Rede vai pedir antes de assinar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Visão da rede\u003c/td>\n\u003ctd>Cada unidade é uma escola separada. A mesma pessoa pode trocar de unidade no menu (\u003ccode>artifacts/iaschool-app/src/components/app-shell.tsx\u003c/code>), mas não há painel da rede inteira nem cobrança por rede\u003c/td>\n\u003ctd>\u003cstrong>A definir\u003c/strong> se o primeiro contrato precisa disso\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capacidade\u003c/td>\n\u003ctd>Não medida para milhares de alunos e fotos por evento\u003c/td>\n\u003ctd>Unidade de 2.000 alunos em festa junina\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2>Sinais de boa candidata\u003c/h2>\n\u003cul>\n\u003cli>A direção já se incomodou com foto de aluno em pasta aberta ou rede social.\u003c/li>\n\u003cli>A rede tem marketing ou comunicação central.\u003c/li>\n\u003cli>Já pede autorização de uso de imagem na matrícula.\u003c/li>\n\u003cli>Contrata fotógrafo nos eventos (volume alto de fotos).\u003c/li>\n\u003c/ul>\n\u003ch2>Fora do foco agora\u003c/h2>\n\u003cul>\n\u003cli>Rede pública: compra por licitação.\u003c/li>\n\u003cli>Escola de unidade única: fora do foco do primeiro ciclo.\u003c/li>\n\u003cli>Redes acima de 20 unidades, até os pré-requisitos fecharem.\u003c/li>\n\u003c/ul>\n\u003ch2>Lista de redes-alvo\u003c/h2>\n\u003cp>Manter fora do repositório, em planilha ou CRM: nome da rede, número de\nunidades, alunos por unidade, decisor e situação da conversa. Nome e contato de\npessoa não entram neste Markdown.\u003c/p>\n\u003ch2>Ainda a definir\u003c/h2>\n\u003cul>\n\u003cli>Se o primeiro contrato exige painel da rede inteira.\u003c/li>\n\u003cli>Ensino médio: como fica a autorização do aluno que já fez 18 anos. Confirmar com produto.\u003c/li>\n\u003c/ul>\n","text":" Público e perfil de escola ideal ICP Status: Definido em entrevista com a equipe em 31/10/2026. Os pontos ainda abertos estão marcados. Persona descreve pessoas. ICP descreve quem compra. Aqui quem compra é a rede: quem assina não é quem usa, e quem sente o resultado a família não paga. ICP do primeiro contrato Critério Decisão Status Tipo Rede particular com várias unidades Definido Tamanho da rede 5 a 20 unidades Definido Porte por unidade Varia de 150 a 2.000 alunos Definido informação dos contatos Etapas Educação infantil ao ensino médio Definido Região Guarulhos e São Paulo Definido Quem decide Dono ou diretor a da rede Definido Como entrega fotos hoje Drive ou Google Fotos, rede social da escola, fotógrafo ou app escolar Definido informação dos contatos Acesso Relação próxima com várias redes da região Definido Por que rede A equipe tem relação próxima com várias redes: a primeira venda é por relacionamento, não por anúncio. Um contrato cobre várias unidades. O piloto em poucas unidades vira caso para o resto da rede e para outras redes. Segunda onda: redes de 20 a 300 unidades Os contatos incluem redes de até 300 unidades. Elas ficam para depois do primeiro contrato e dos pré requisitos abaixo, porque exigem compra formal, jurídico, TI e volume que o produto ainda não comprovou. Pré requisitos de produto para este ICP Pré requisito Situação hoje Por que trava Importação de alunos e responsáveis por planilha Decidida em 31/10/2026, não construída. Hoje o cadastro é aluno por aluno Rede de 5 unidades com 500 alunos cada tem 2.500 alunos Autorização e entrega em escala O link de autorização só sai pelo WhatsApp artifacts/iaschool app/supabase/functions/request guardian consent/index.ts:5 6 . O envio comercial está desligado e o adaptador da Meta não existe Sem isso nenhuma família autoriza nem recebe fotos Foto real de aluno liberada Gates abertos em pendências de produção ../../docs/pendencias producao.md O piloto pago depende disso Homologação jurídica e contrato de dados Pendente pendências ../../docs/pendencias producao.md , item 5 Rede vai pedir antes de assinar Visão da rede Cada unidade é uma escola separada. A mesma pessoa pode trocar de unidade no menu artifacts/iaschool app/src/components/app shell.tsx , mas não há painel da rede inteira nem cobrança por rede A definir se o primeiro contrato precisa disso Capacidade Não medida para milhares de alunos e fotos por evento Unidade de 2.000 alunos em festa junina Sinais de boa candidata A direção já se incomodou com foto de aluno em pasta aberta ou rede social. A rede tem marketing ou comunicação central. Já pede autorização de uso de imagem na matrícula. Contrata fotógrafo nos eventos volume alto de fotos . Fora do foco agora Rede pública: compra por licitação. Escola de unidade única: fora do foco do primeiro ciclo. Redes acima de 20 unidades, até os pré requisitos fecharem. Lista de redes alvo Manter fora do repositório, em planilha ou CRM: nome da rede, número de unidades, alunos por unidade, decisor e situação da conversa. Nome e contato de pessoa não entram neste Markdown. Ainda a definir Se o primeiro contrato exige painel da rede inteira. Ensino médio: como fica a autorização do aluno que já fez 18 anos. Confirmar com produto. ","pend":["Visão da rede · Cada unidade é uma escola separada. A mesma pessoa pode trocar de unidade no menu (\u003ccode>artifacts/iaschool-app/src/components/app-shell.tsx\u003c/code>), mas não há painel da rede inteira nem cobrança por rede · \u003cstrong>A definir\u003c/strong> se o primeiro contrato precisa disso","Se o primeiro contrato exige painel da rede inteira.","Ensino médio: como fica a autorização do aluno que já fez 18 anos. Confirmar com produto."]},{"id":"02-marca--identidade-visual","rel":"02-marca/identidade-visual.md","group":"Marca","title":"Identidade visual","status":{"key":"definido","label":"Definido"},"html":"\u003ch1>Identidade visual\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Definido em 30/10/2026 (\u003ca href=\"../BACKLOG.md\" target=\"_blank\" data-externo=\"1\">BACKLOG\u003c/a>, seção &quot;Nova\nmarca AIESCOLA&quot;). Conceito 1, &quot;A de aula&quot;: A de livro aberto com faísca de IA; o\npingo do &quot;i&quot; vira faísca.\u003c/p>\n\u003ch2>Paleta\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nome\u003c/th>\n\u003cth>Cor\u003c/th>\n\u003cth>Uso\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Azul Caderno\u003c/td>\n\u003ctd>\u003ccode>#2447D6\u003c/code>\u003c/td>\n\u003ctd>Primária, botões, links\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tinta\u003c/td>\n\u003ctd>\u003ccode>#0F1A3D\u003c/code>\u003c/td>\n\u003ctd>Texto, fundo escuro\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Faísca\u003c/td>\n\u003ctd>\u003ccode>#F26B1D\u003c/code>\u003c/td>\n\u003ctd>Acento, a faísca da IA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Giz\u003c/td>\n\u003ctd>\u003ccode>#FFD25A\u003c/code>\u003c/td>\n\u003ctd>Destaques, selos\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Névoa\u003c/td>\n\u003ctd>\u003ccode>#E6EAF7\u003c/code>\u003c/td>\n\u003ctd>Superfícies, cards\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Papel\u003c/td>\n\u003ctd>\u003ccode>#F8F6F1\u003c/code>\u003c/td>\n\u003ctd>Fundo\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Contraste:\u003c/strong> Faísca em fundo claro dá só 3:1. Use em ícone e título grande,\nnunca em texto corrido nem em botão com texto branco. Botão principal em Azul\nCaderno. No modo escuro a primária vira \u003ccode>#9DB0FF\u003c/code> sobre Tinta.\u003c/p>\n\u003ch2>Tipografia\u003c/h2>\n\u003cul>\n\u003cli>Títulos: Bricolage Grotesque, peso 700 a 800.\u003c/li>\n\u003cli>Interface e texto: Plus Jakarta Sans, peso 400 a 700.\u003c/li>\n\u003c/ul>\n\u003ch2>Arquivos\u003c/h2>\n\u003cul>\n\u003cli>PDFs da marca: \u003ccode>branding/\u003c/code> na raiz (logo e variações, cores e tipografia, aplicações).\u003c/li>\n\u003cli>SVGs finais: \u003ca href=\"../artifacts/iaschool-ui/public/brand\" target=\"_blank\" data-externo=\"1\">\u003ccode>artifacts/iaschool-ui/public/brand/\u003c/code>\u003c/a>\n(logo, logotipo, símbolo e favicon em versões clara, escura, mono e branca).\u003c/li>\n\u003c/ul>\n\u003ch2>Imagens\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Sem foto real de criança ou adolescente.\u003c/strong> Use ilustração abstrata, como a\nlanding já faz, ou foto de objeto, espaço ou adulto.\u003c/li>\n\u003cli>Foto de banco de imagem com criança: pergunte antes. Precisa de licença de uso\ne de decisão explícita de vocês.\u003c/li>\n\u003cli>Tela do produto em peça de marketing: só com dados sintéticos de demonstração.\u003c/li>\n\u003c/ul>\n\u003ch2>A definir\u003c/h2>\n\u003cul>\n\u003cli>Slogan oficial.\u003c/li>\n\u003cli>Modelos para redes sociais (post, story, capa).\u003c/li>\n\u003c/ul>\n","text":" Identidade visual Status: Definido em 30/10/2026 BACKLOG ../../BACKLOG.md , seção \"Nova marca AIESCOLA\" . Conceito 1, \"A de aula\": A de livro aberto com faísca de IA; o pingo do \"i\" vira faísca. Paleta Nome Cor Uso Azul Caderno 2447D6 Primária, botões, links Tinta 0F1A3D Texto, fundo escuro Faísca F26B1D Acento, a faísca da IA Giz FFD25A Destaques, selos Névoa E6EAF7 Superfícies, cards Papel F8F6F1 Fundo Contraste: Faísca em fundo claro dá só 3:1. Use em ícone e título grande, nunca em texto corrido nem em botão com texto branco. Botão principal em Azul Caderno. No modo escuro a primária vira 9DB0FF sobre Tinta. Tipografia Títulos: Bricolage Grotesque, peso 700 a 800. Interface e texto: Plus Jakarta Sans, peso 400 a 700. Arquivos PDFs da marca: branding/ na raiz logo e variações, cores e tipografia, aplicações . SVGs finais: artifacts/iaschool ui/public/brand/ ../../artifacts/iaschool ui/public/brand/ logo, logotipo, símbolo e favicon em versões clara, escura, mono e branca . Imagens Sem foto real de criança ou adolescente. Use ilustração abstrata, como a landing já faz, ou foto de objeto, espaço ou adulto. Foto de banco de imagem com criança: pergunte antes. Precisa de licença de uso e de decisão explícita de vocês. Tela do produto em peça de marketing: só com dados sintéticos de demonstração. A definir Slogan oficial. Modelos para redes sociais post, story, capa . ","pend":["Slogan oficial.","Modelos para redes sociais (post, story, capa)."]},{"id":"02-marca--voz-e-tom","rel":"02-marca/voz-e-tom.md","group":"Marca","title":"Voz e tom","status":{"key":"definido","label":"Definido"},"html":"\u003ch1>Voz e tom\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Definido a partir da landing atual e das regras do projeto.\u003c/p>\n\u003ch2>Voz\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Clara:\u003c/strong> frase curta, verbo de ação, uma ideia por frase.\u003c/li>\n\u003cli>\u003cstrong>Concreta:\u003c/strong> diz o que acontece (&quot;a escola sobe as fotos, a equipe confere&quot;), não adjetivos.\u003c/li>\n\u003cli>\u003cstrong>Cuidadosa:\u003c/strong> fala de imagem de criança com seriedade, sem medo e sem exagero.\u003c/li>\n\u003cli>\u003cstrong>De escola:\u003c/strong> vocabulário de quem trabalha em escola, não de quem trabalha com tecnologia.\u003c/li>\n\u003c/ul>\n\u003ch2>Vocabulário\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Use\u003c/th>\n\u003cth>Evite\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>aluno, turma, escola, evento\u003c/td>\n\u003ctd>usuário, registro, tenant\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsável, família\u003c/td>\n\u003ctd>&quot;pais&quot; quando incluir avós e tutores\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>autorização\u003c/td>\n\u003ctd>consentimento LGPD, opt-in\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reconhecimento facial sugere\u003c/td>\n\u003ctd>a IA identifica com precisão\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>arte, álbum\u003c/td>\n\u003ctd>post, asset, conteúdo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>conferir, revisar, confirmar\u003c/td>\n\u003ctd>validar o output\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Nunca use\u003c/strong> (regra do projeto): atleta, escolinha, clube, brasão, uniforme,\nposição, métrica, R9, IAsport.\u003c/p>\n\u003cp>\u003cstrong>Nunca prometa:\u003c/strong> 100% seguro, garantido, &quot;em conformidade com o ECA\nDigital&quot;, &quot;a IA nunca erra&quot;, números de volume ou velocidade sem medição.\u003c/p>\n\u003cp>Evite também: revolucionário, robusto, inovador, sinergia, potencializar.\u003c/p>\n\u003ch2>Tom por público\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Público\u003c/th>\n\u003cth>Tom\u003c/th>\n\u003cth>Exemplo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Direção\u003c/td>\n\u003ctd>Controle e prova\u003c/td>\n\u003ctd>&quot;Você sabe quem autorizou, o que foi enviado e para quem.&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Coordenação e equipe\u003c/td>\n\u003ctd>Prático, poupa tempo\u003c/td>\n\u003ctd>&quot;Suba o evento inteiro de uma vez e só revise as sugestões.&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Família\u003c/td>\n\u003ctd>Acolhedor e simples\u003c/td>\n\u003ctd>&quot;As fotos do seu filho estão neste link.&quot;\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2>Certo e errado\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Errado\u003c/th>\n\u003cth>Certo\u003c/th>\n\u003cth>Por quê\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>&quot;Nossa IA identifica cada aluno automaticamente.&quot;\u003c/td>\n\u003ctd>&quot;A IA sugere quem está em cada foto. Uma pessoa da escola confere.&quot;\u003c/td>\n\u003ctd>A revisão é humana e obrigatória\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Totalmente de acordo com o ECA Digital.&quot;\u003c/td>\n\u003ctd>&quot;A família autoriza cada uso e pode retirar a autorização.&quot;\u003c/td>\n\u003ctd>Não há homologação jurídica\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Fotos prontas em minutos.&quot;\u003c/td>\n\u003ctd>&quot;O evento inteiro sobe de uma vez.&quot;\u003c/td>\n\u003ctd>Tempo não medido\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","text":" Voz e tom Status: Definido a partir da landing atual e das regras do projeto. Voz Clara: frase curta, verbo de ação, uma ideia por frase. Concreta: diz o que acontece \"a escola sobe as fotos, a equipe confere\" , não adjetivos. Cuidadosa: fala de imagem de criança com seriedade, sem medo e sem exagero. De escola: vocabulário de quem trabalha em escola, não de quem trabalha com tecnologia. Vocabulário Use Evite aluno, turma, escola, evento usuário, registro, tenant responsável, família \"pais\" quando incluir avós e tutores autorização consentimento LGPD, opt in reconhecimento facial sugere a IA identifica com precisão arte, álbum post, asset, conteúdo conferir, revisar, confirmar validar o output Nunca use regra do projeto : atleta, escolinha, clube, brasão, uniforme, posição, métrica, R9, IAsport. Nunca prometa: 100% seguro, garantido, \"em conformidade com o ECA Digital\", \"a IA nunca erra\", números de volume ou velocidade sem medição. Evite também: revolucionário, robusto, inovador, sinergia, potencializar. Tom por público Público Tom Exemplo Direção Controle e prova \"Você sabe quem autorizou, o que foi enviado e para quem.\" Coordenação e equipe Prático, poupa tempo \"Suba o evento inteiro de uma vez e só revise as sugestões.\" Família Acolhedor e simples \"As fotos do seu filho estão neste link.\" Certo e errado Errado Certo Por quê \"Nossa IA identifica cada aluno automaticamente.\" \"A IA sugere quem está em cada foto. Uma pessoa da escola confere.\" A revisão é humana e obrigatória \"Totalmente de acordo com o ECA Digital.\" \"A família autoriza cada uso e pode retirar a autorização.\" Não há homologação jurídica \"Fotos prontas em minutos.\" \"O evento inteiro sobe de uma vez.\" Tempo não medido ","pend":[]},{"id":"03-canais--landing--copy-landing-v2","rel":"03-canais/landing/copy-landing-v2.md","group":"Canais","title":"Copy da landing, versão 2 (rascunho)","status":{"key":"rascunho","label":"Rascunho"},"html":"\u003ch1>Copy da landing, versão 2 (rascunho)\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Rascunho de 31/10/2026, ainda não aplicado ao código. Base: a\nlanding atual em \u003ca href=\"../artifacts/iaschool-app/src/pages/landing.tsx\" target=\"_blank\" data-externo=\"1\">\u003ccode>landing.tsx\u003c/code>\u003c/a>.\nA estrutura das seções continua a mesma. Mudam os textos que prometem mais do\nque o produto entrega ou que dependem de revisão jurídica. Os achados estão em\n\u003ca href=\"#07-conformidade--regras-de-comunicacao\">regras de comunicação\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Público:\u003c/strong> dono ou direção de rede particular de 5 a 20 unidades, e a coordenação das unidades (\u003ca href=\"#01-estrategia--publico-e-icp\">ICP\u003c/a>, \u003ca href=\"#01-estrategia--personas\">personas\u003c/a>).\n\u003cstrong>Objetivo da página:\u003c/strong> pedido de demonstração.\n\u003cstrong>Voz:\u003c/strong> \u003ca href=\"#02-marca--voz-e-tom\">voz e tom\u003c/a>: clara, concreta, cuidadosa.\u003c/p>\n\u003chr>\n\u003ch2>SEO\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Meta title (51 caracteres):\u003c/strong> AIESCOLA | Fotos da escola entregues a cada família\u003c/li>\n\u003cli>\u003cstrong>Meta description (149 caracteres):\u003c/strong> A escola sobe as fotos do evento, a IA separa por aluno e a equipe confere. Cada família recebe só as fotos do seu filho, com autorização registrada.\u003c/li>\n\u003c/ul>\n\u003ch2>Hero\u003c/h2>\n\u003cp>\u003cstrong>Título, três opções:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>A (atual, recomendada):\u003c/strong> Cada família recebe as fotos do seu filho.\u003c/li>\n\u003cli>\u003cstrong>B:\u003c/strong> As fotos do evento, separadas por aluno e entregues a cada família.\u003c/li>\n\u003cli>\u003cstrong>C:\u003c/strong> Chega de foto do evento perdida no grupo da turma.\u003c/li>\n\u003c/ul>\n\u003cp>A opção A fala do resultado que a escola quer entregar. A B explica melhor o\nproduto e serve para teste A/B. A C ataca a dor, mas puxa para o problema.\u003c/p>\n\u003cp>\u003cstrong>Subtítulo:\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A escola sobe as fotos do evento, a AIESCOLA sugere quem está em cada uma e a\nequipe confere. Cada responsável recebe um álbum só com as fotos do próprio\nfilho, com a autorização registrada.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>Botão principal:\u003c/strong> Agendar demonstração\n\u003cstrong>Botão secundário:\u003c/strong> Ver como funciona\u003c/p>\n\u003cp>\u003cstrong>Selos abaixo dos botões:\u003c/strong> Revisão humana antes de enviar · Sem app para a família · Autorização por finalidade\u003c/p>\n\u003ch2>Problema\u003c/h2>\n\u003cp>\u003cstrong>Título:\u003c/strong> Depois do evento, começa o trabalho que ninguém vê.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Horas\u003c/strong> abrindo foto por foto para descobrir quem aparece em cada uma.\u003c/li>\n\u003cli>\u003cstrong>Grupos\u003c/strong> e pastas abertas onde todo mundo vê a foto de todo mundo.\u003c/li>\n\u003cli>\u003cstrong>Dúvida\u003c/strong> sobre quais famílias autorizaram o uso da imagem do filho.\u003c/li>\n\u003c/ul>\n\u003cp>Sem mudança: o texto atual já está bom.\u003c/p>\n\u003ch2>Como funciona\u003c/h2>\n\u003cp>\u003cstrong>Título:\u003c/strong> Do upload ao álbum da família em quatro passos\n\u003cstrong>Apoio:\u003c/strong> A escola controla cada etapa. A IA faz a parte repetitiva.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Cadastro e autorização.\u003c/strong> A escola cadastra turmas e alunos. O responsável autoriza o reconhecimento facial e o recebimento das fotos, cada um separado.\u003c/li>\n\u003cli>\u003cstrong>Upload do evento.\u003c/strong> Depois da festa, da formatura ou do passeio, a equipe sobe todas as fotos de uma vez.\u003c/li>\n\u003cli>\u003cstrong>Separação e revisão.\u003c/strong> O reconhecimento facial sugere quem está em cada foto. Uma pessoa da escola confere e confirma.\u003c/li>\n\u003cli>\u003cstrong>Entrega à família.\u003c/strong> Cada responsável recebe um link com as fotos aprovadas do seu filho.\u003c/li>\n\u003c/ol>\n\u003cp>O texto atual do passo 4 diz &quot;agrupadas por evento&quot;. Esse álbum só existe no\ncódigo local, sem publicação. Volte com a frase quando ele for publicado.\u003c/p>\n\u003ch2>Recursos\u003c/h2>\n\u003cp>\u003cstrong>Título:\u003c/strong> Tudo o que a escola precisa para entregar fotos com cuidado\u003c/p>\n\u003cp>\u003cstrong>Destaque: Reconhecimento com revisão humana\u003c/strong>\nA IA sugere quem está em cada foto do evento. Nada vai para a família sem uma\npessoa da escola conferir.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Álbum por link.\u003c/strong> Sem aplicativo para instalar. A família abre o link no celular e baixa as fotos uma a uma ou todas em ZIP.\u003c/li>\n\u003cli>\u003cstrong>Artes com IA por aluno.\u003c/strong> Gere artes por aluno e turma a partir do modelo da escola. A mensagem de compartilhamento avisa que a imagem foi feita por inteligência artificial.\u003c/li>\n\u003cli>\u003cstrong>Turmas e eventos organizados.\u003c/strong> Pasta de cada aluno com as fotos confirmadas, separadas por evento.\u003c/li>\n\u003cli>\u003cstrong>Registro de tudo.\u003c/strong> Quem aprovou, o que foi enviado e quando o álbum foi aberto ficam registrados.\u003c/li>\n\u003c/ul>\n\u003ch2>Segurança\u003c/h2>\n\u003cp>\u003cstrong>Título:\u003c/strong> Feita para quem cuida de imagem de criança e adolescente.\n\u003cstrong>Apoio:\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Cada etapa depende da autorização do responsável. A escola sabe quem\nautorizou, o que foi enviado e para quem.\u003c/p>\n\u003c/blockquote>\n\u003cp>Saiu a frase &quot;construída em torno das regras do ECA Digital&quot;. Ela só volta\ndepois da revisão jurídica, que já é pendência no BACKLOG.\u003c/p>\n\u003cul>\n\u003cli>Autorização do responsável separada por finalidade: reconhecimento facial e recebimento das fotos.\u003c/li>\n\u003cli>Se a autorização for retirada, o reconhecimento para e o acesso pelo link é interrompido.\u003c/li>\n\u003cli>Link exclusivo por família, com acesso de prazo curto que a escola pode cancelar.\u003c/li>\n\u003cli>Cada família recebe só as fotos em que o próprio filho foi confirmado pela escola.\u003c/li>\n\u003cli>Arte gerada por IA vai com o aviso de que foi feita por inteligência artificial.\u003c/li>\n\u003cli>Registro de aprovações, envios e aberturas para a escola prestar contas.\u003c/li>\n\u003c/ul>\n\u003ch2>Para quem\u003c/h2>\n\u003cp>\u003cstrong>Título:\u003c/strong> Um fluxo, três pessoas mais tranquilas\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Direção e coordenação.\u003c/strong> Eventos, entregas e autorizações num só lugar, com registro de tudo.\u003c/li>\n\u003cli>\u003cstrong>Equipe da escola.\u003c/strong> Sobe o evento inteiro de uma vez e só revisa as sugestões, sem separar foto à mão.\u003c/li>\n\u003cli>\u003cstrong>Famílias.\u003c/strong> Recebem só as fotos do filho, num link que abre no celular.\u003c/li>\n\u003c/ul>\n\u003cp>Saiu &quot;e baixam quando quiserem&quot;: o acesso tem prazo e a escola define por\nquanto tempo guarda as fotos.\u003c/p>\n\u003ch2>Prova social\u003c/h2>\n\u003cp>\u003cstrong>Ainda não existe.\u003c/strong> Não publicar depoimento, logo de escola ou número de uso\nantes de ter cliente real, com autorização escrita para cada item. Até lá, a\nseção fica fora da página. Quando houver piloto, o lugar dela é entre &quot;Como\nfunciona&quot; e &quot;Recursos&quot;:\u003c/p>\n\u003cblockquote>\n\u003cp>[Depoimento curto da direção sobre o primeiro evento entregue]\n[Nome, cargo, escola], só com autorização escrita\u003c/p>\n\u003c/blockquote>\n\u003ch2>Perguntas frequentes\u003c/h2>\n\u003cp>\u003cstrong>Título:\u003c/strong> O que as escolas costumam perguntar\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>A família precisa instalar algum aplicativo?\u003c/strong>\nNão. O responsável recebe um link e abre no navegador do celular ou do computador. Dali dá para ver e baixar as fotos.\u003c/li>\n\u003cli>\u003cstrong>O reconhecimento facial decide sozinho quem está na foto?\u003c/strong>\nNão. Ele sugere, e uma pessoa da escola revisa e confirma antes de qualquer foto ser entregue.\u003c/li>\n\u003cli>\u003cstrong>E se o responsável não autorizar?\u003c/strong>\nSem a autorização, o aluno não entra no reconhecimento e a família não recebe fotos pela plataforma. A autorização pode ser retirada depois.\u003c/li>\n\u003cli>\u003cstrong>Outras crianças podem aparecer nas fotos que a família recebe?\u003c/strong> \u003cem>(nova, substitui &quot;Uma família pode ver fotos de outro aluno?&quot;)\u003c/em>\nEm foto de grupo, sim. A família recebe as fotos em que o próprio filho foi confirmado, e colegas podem aparecer nelas. A escola escolhe, na revisão, quais fotos entram em cada entrega.\n\u003cstrong>Depende de revisão jurídica\u003c/strong> antes de publicar: o termo de entrega atual ainda fala em desfoque.\u003c/li>\n\u003cli>\u003cstrong>Se a autorização for retirada, o que acontece com as fotos já baixadas?\u003c/strong> \u003cem>(nova)\u003c/em>\nO acesso pela plataforma é interrompido. As fotos que a família já baixou ficam com ela, como qualquer arquivo salvo no celular.\u003c/li>\n\u003cli>\u003cstrong>Por quanto tempo as fotos ficam disponíveis?\u003c/strong> \u003cem>(nova)\u003c/em>\nA escola define o prazo de armazenamento quando cria o evento.\n\u003cstrong>Confirmar com produto\u003c/strong> o que acontece com as fotos ao fim do prazo antes de detalhar.\u003c/li>\n\u003cli>\u003cstrong>Serve para qualquer etapa de ensino?\u003c/strong>\nSim. Educação infantil, fundamental e médio: festas, formaturas, passeios e qualquer evento com fotos.\u003c/li>\n\u003cli>\u003cstrong>Funciona para rede com várias unidades?\u003c/strong> \u003cem>(nova)\u003c/em>\nSim. Cada unidade tem seus eventos e sua equipe, e a mesma pessoa pode alternar entre as unidades.\u003c/li>\n\u003cli>\u003cstrong>Quanto custa?\u003c/strong> \u003cem>(nova)\u003c/em>\nA oferta está em \u003ca href=\"#01-estrategia--oferta-e-preco\">oferta e preço\u003c/a>: R$ 6,00 por aluno por mês.\n\u003cstrong>A definir\u003c/strong> se o preço aparece na página ou só na proposta.\u003c/li>\n\u003c/ol>\n\u003ch2>Chamada final\u003c/h2>\n\u003cp>\u003cstrong>Título, duas opções:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>A (recomendada):\u003c/strong> Veja o fluxo completo antes do próximo evento.\u003c/li>\n\u003cli>\u003cstrong>B:\u003c/strong> Prepare a entrega de fotos da sua escola para 2027.\u003c/li>\n\u003c/ul>\n\u003cp>A atual, &quot;Leve o próximo evento da sua escola para a AIESCOLA&quot;, convida a usar\nfotos reais já, o que ainda não é permitido. A opção B aproveita a janela de\nplanejamento do ano que vem.\u003c/p>\n\u003cp>\u003cstrong>Apoio:\u003c/strong> Mostramos o fluxo completo com material de demonstração, do upload ao álbum da família.\n\u003cstrong>Botão:\u003c/strong> Agendar demonstração\u003c/p>\n\u003ch2>Rodapé\u003c/h2>\n\u003cp>© [ano] AIESCOLA. Fotos da escola, entregues a cada família.\nLink: Acesso da escola\u003c/p>\n\u003chr>\n\u003ch2>Notas\u003c/h2>\n\u003cp>\u003cstrong>Voz aplicada:\u003c/strong> a da \u003ca href=\"#02-marca--voz-e-tom\">voz e tom\u003c/a>, com\nvocabulário escolar e sem promessa de volume, velocidade ou conformidade legal.\u003c/p>\n\u003cp>\u003cstrong>SEO.\u003c/strong> Palavras-chave sugeridas, sem consulta a ferramenta de volume de\nbusca (validar antes de usar):\u003c/p>\n\u003cul>\n\u003cli>Principal: &quot;entrega de fotos escolares&quot;\u003c/li>\n\u003cli>Relacionadas: &quot;fotos de eventos escolares&quot;, &quot;autorização de uso de imagem escola&quot;, &quot;álbum de fotos para pais&quot;, &quot;reconhecimento facial fotos escola&quot;\u003c/li>\n\u003cli>Colocar a principal no título da página, no primeiro parágrafo e na meta description.\u003c/li>\n\u003cli>Links internos: das futuras pautas do \u003ca href=\"#05-conteudo--calendario-editorial\">calendário editorial\u003c/a> para a landing.\u003c/li>\n\u003cli>Texto alternativo: a ilustração do produto pode ter \u003ccode>alt=&quot;Tela da AIESCOLA com fotos de um evento separadas por aluno&quot;\u003c/code>. Hoje ela é decorativa.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Mudanças em relação à landing atual\u003c/strong>\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Trecho atual\u003c/th>\n\u003cth>Proposta\u003c/th>\n\u003cth>Motivo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>&quot;construída em torno ... das regras do ECA Digital&quot;\u003c/td>\n\u003ctd>Removido até a revisão jurídica\u003c/td>\n\u003ctd>Afirmação de conformidade sem homologação\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;nunca as de outro aluno&quot; e FAQ &quot;Uma família pode ver fotos de outro aluno? Não.&quot;\u003c/td>\n\u003ctd>&quot;só as fotos em que o próprio filho foi confirmado&quot; e FAQ nova sobre foto de grupo\u003c/td>\n\u003ctd>As entregas usam fotos nítidas, e colegas aparecem em foto de grupo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Toda imagem gerada por IA sai identificada como tal.&quot;\u003c/td>\n\u003ctd>&quot;Arte gerada por IA vai com o aviso de que foi feita por inteligência artificial.&quot;\u003c/td>\n\u003ctd>O aviso está na mensagem de compartilhamento, não na imagem\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;separar milhares de fotos&quot;\u003c/td>\n\u003ctd>&quot;sugere quem está em cada foto do evento&quot;\u003c/td>\n\u003ctd>Volume não medido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;filtra por evento&quot;, &quot;agrupadas por evento&quot;\u003c/td>\n\u003ctd>Removido\u003c/td>\n\u003ctd>Álbum agrupado por evento só existe local\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;baixam quando quiserem&quot;\u003c/td>\n\u003ctd>Removido\u003c/td>\n\u003ctd>Acesso tem prazo e retenção\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Leve o próximo evento da sua escola&quot;\u003c/td>\n\u003ctd>&quot;Veja o fluxo completo antes do próximo evento.&quot;\u003c/td>\n\u003ctd>Foto real de aluno ainda não é permitida\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Próximos passos da peça:\u003c/strong> revisão jurídica dos trechos marcados, decidir a\noferta para a FAQ de preço e, depois, aplicar no \u003ccode>landing.tsx\u003c/code> com o item do\nBACKLOG.\u003c/p>\n","text":" Copy da landing, versão 2 rascunho Status: Rascunho de 31/10/2026, ainda não aplicado ao código. Base: a landing atual em landing.tsx ../../../artifacts/iaschool app/src/pages/landing.tsx . A estrutura das seções continua a mesma. Mudam os textos que prometem mais do que o produto entrega ou que dependem de revisão jurídica. Os achados estão em regras de comunicação ../../07 conformidade/regras de comunicacao.md . Público: dono ou direção de rede particular de 5 a 20 unidades, e a coordenação das unidades ICP ../../01 estrategia/publico e icp.md , personas ../../01 estrategia/personas.md . Objetivo da página: pedido de demonstração. Voz: voz e tom ../../02 marca/voz e tom.md : clara, concreta, cuidadosa. SEO Meta title 51 caracteres : AIESCOLA Fotos da escola entregues a cada família Meta description 149 caracteres : A escola sobe as fotos do evento, a IA separa por aluno e a equipe confere. Cada família recebe só as fotos do seu filho, com autorização registrada. Hero Título, três opções: A atual, recomendada : Cada família recebe as fotos do seu filho. B: As fotos do evento, separadas por aluno e entregues a cada família. C: Chega de foto do evento perdida no grupo da turma. A opção A fala do resultado que a escola quer entregar. A B explica melhor o produto e serve para teste A/B. A C ataca a dor, mas puxa para o problema. Subtítulo: A escola sobe as fotos do evento, a AIESCOLA sugere quem está em cada uma e a equipe confere. Cada responsável recebe um álbum só com as fotos do próprio filho, com a autorização registrada. Botão principal: Agendar demonstração Botão secundário: Ver como funciona Selos abaixo dos botões: Revisão humana antes de enviar · Sem app para a família · Autorização por finalidade Problema Título: Depois do evento, começa o trabalho que ninguém vê. Horas abrindo foto por foto para descobrir quem aparece em cada uma. Grupos e pastas abertas onde todo mundo vê a foto de todo mundo. Dúvida sobre quais famílias autorizaram o uso da imagem do filho. Sem mudança: o texto atual já está bom. Como funciona Título: Do upload ao álbum da família em quatro passos Apoio: A escola controla cada etapa. A IA faz a parte repetitiva. 1. Cadastro e autorização. A escola cadastra turmas e alunos. O responsável autoriza o reconhecimento facial e o recebimento das fotos, cada um separado. 2. Upload do evento. Depois da festa, da formatura ou do passeio, a equipe sobe todas as fotos de uma vez. 3. Separação e revisão. O reconhecimento facial sugere quem está em cada foto. Uma pessoa da escola confere e confirma. 4. Entrega à família. Cada responsável recebe um link com as fotos aprovadas do seu filho. O texto atual do passo 4 diz \"agrupadas por evento\". Esse álbum só existe no código local, sem publicação. Volte com a frase quando ele for publicado. Recursos Título: Tudo o que a escola precisa para entregar fotos com cuidado Destaque: Reconhecimento com revisão humana A IA sugere quem está em cada foto do evento. Nada vai para a família sem uma pessoa da escola conferir. Álbum por link. Sem aplicativo para instalar. A família abre o link no celular e baixa as fotos uma a uma ou todas em ZIP. Artes com IA por aluno. Gere artes por aluno e turma a partir do modelo da escola. A mensagem de compartilhamento avisa que a imagem foi feita por inteligência artificial. Turmas e eventos organizados. Pasta de cada aluno com as fotos confirmadas, separadas por evento. Registro de tudo. Quem aprovou, o que foi enviado e quando o álbum foi aberto ficam registrados. Segurança Título: Feita para quem cuida de imagem de criança e adolescente. Apoio: Cada etapa depende da autorização do responsável. A escola sabe quem autorizou, o que foi enviado e para quem. Saiu a frase \"construída em torno das regras do ECA Digital\". Ela só volta depois da revisão jurídica, que já é pendência no BACKLOG. Autorização do responsável separada por finalidade: reconhecimento facial e recebimento das fotos. Se a autorização for retirada, o reconhecimento para e o acesso pelo link é interrompido. Link exclusivo por família, com acesso de prazo curto que a escola pode cancelar. Cada família recebe só as fotos em que o próprio filho foi confirmado pela escola. Arte gerada por IA vai com o aviso de que foi feita por inteligência artificial. Registro de aprovações, envios e aberturas para a escola prestar contas. Para quem Título: Um fluxo, três pessoas mais tranquilas Direção e coordenação. Eventos, entregas e autorizações num só lugar, com registro de tudo. Equipe da escola. Sobe o evento inteiro de uma vez e só revisa as sugestões, sem separar foto à mão. Famílias. Recebem só as fotos do filho, num link que abre no celular. Saiu \"e baixam quando quiserem\": o acesso tem prazo e a escola define por quanto tempo guarda as fotos. Prova social Ainda não existe. Não publicar depoimento, logo de escola ou número de uso antes de ter cliente real, com autorização escrita para cada item. Até lá, a seção fica fora da página. Quando houver piloto, o lugar dela é entre \"Como funciona\" e \"Recursos\": Depoimento curto da direção sobre o primeiro evento entregue Nome, cargo, escola , só com autorização escrita Perguntas frequentes Título: O que as escolas costumam perguntar 1. A família precisa instalar algum aplicativo? Não. O responsável recebe um link e abre no navegador do celular ou do computador. Dali dá para ver e baixar as fotos. 2. O reconhecimento facial decide sozinho quem está na foto? Não. Ele sugere, e uma pessoa da escola revisa e confirma antes de qualquer foto ser entregue. 3. E se o responsável não autorizar? Sem a autorização, o aluno não entra no reconhecimento e a família não recebe fotos pela plataforma. A autorização pode ser retirada depois. 4. Outras crianças podem aparecer nas fotos que a família recebe? nova, substitui \"Uma família pode ver fotos de outro aluno?\" Em foto de grupo, sim. A família recebe as fotos em que o próprio filho foi confirmado, e colegas podem aparecer nelas. A escola escolhe, na revisão, quais fotos entram em cada entrega. Depende de revisão jurídica antes de publicar: o termo de entrega atual ainda fala em desfoque. 5. Se a autorização for retirada, o que acontece com as fotos já baixadas? nova O acesso pela plataforma é interrompido. As fotos que a família já baixou ficam com ela, como qualquer arquivo salvo no celular. 6. Por quanto tempo as fotos ficam disponíveis? nova A escola define o prazo de armazenamento quando cria o evento. Confirmar com produto o que acontece com as fotos ao fim do prazo antes de detalhar. 7. Serve para qualquer etapa de ensino? Sim. Educação infantil, fundamental e médio: festas, formaturas, passeios e qualquer evento com fotos. 8. Funciona para rede com várias unidades? nova Sim. Cada unidade tem seus eventos e sua equipe, e a mesma pessoa pode alternar entre as unidades. 9. Quanto custa? nova A oferta está em oferta e preço ../../01 estrategia/oferta e preco.md : R$ 6,00 por aluno por mês. A definir se o preço aparece na página ou só na proposta. Chamada final Título, duas opções: A recomendada : Veja o fluxo completo antes do próximo evento. B: Prepare a entrega de fotos da sua escola para 2027. A atual, \"Leve o próximo evento da sua escola para a AIESCOLA\", convida a usar fotos reais já, o que ainda não é permitido. A opção B aproveita a janela de planejamento do ano que vem. Apoio: Mostramos o fluxo completo com material de demonstração, do upload ao álbum da família. Botão: Agendar demonstração Rodapé © ano AIESCOLA. Fotos da escola, entregues a cada família. Link: Acesso da escola Notas Voz aplicada: a da voz e tom ../../02 marca/voz e tom.md , com vocabulário escolar e sem promessa de volume, velocidade ou conformidade legal. SEO. Palavras chave sugeridas, sem consulta a ferramenta de volume de busca validar antes de usar : Principal: \"entrega de fotos escolares\" Relacionadas: \"fotos de eventos escolares\", \"autorização de uso de imagem escola\", \"álbum de fotos para pais\", \"reconhecimento facial fotos escola\" Colocar a principal no título da página, no primeiro parágrafo e na meta description. Links internos: das futuras pautas do calendário editorial ../../05 conteudo/calendario editorial.md para a landing. Texto alternativo: a ilustração do produto pode ter alt=\"Tela da AIESCOLA com fotos de um evento separadas por aluno\" . Hoje ela é decorativa. Mudanças em relação à landing atual Trecho atual Proposta Motivo \"construída em torno ... das regras do ECA Digital\" Removido até a revisão jurídica Afirmação de conformidade sem homologação \"nunca as de outro aluno\" e FAQ \"Uma família pode ver fotos de outro aluno? Não.\" \"só as fotos em que o próprio filho foi confirmado\" e FAQ nova sobre foto de grupo As entregas usam fotos nítidas, e colegas aparecem em foto de grupo \"Toda imagem gerada por IA sai identificada como tal.\" \"Arte gerada por IA vai com o aviso de que foi feita por inteligência artificial.\" O aviso está na mensagem de compartilhamento, não na imagem \"separar milhares de fotos\" \"sugere quem está em cada foto do evento\" Volume não medido \"filtra por evento\", \"agrupadas por evento\" Removido Álbum agrupado por evento só existe local \"baixam quando quiserem\" Removido Acesso tem prazo e retenção \"Leve o próximo evento da sua escola\" \"Veja o fluxo completo antes do próximo evento.\" Foto real de aluno ainda não é permitida Próximos passos da peça: revisão jurídica dos trechos marcados, decidir a oferta para a FAQ de preço e, depois, aplicar no landing.tsx com o item do BACKLOG. ","pend":["\u003cstrong>Quanto custa?\u003c/strong> \u003cem>(nova)\u003c/em> A oferta está em \u003ca href=\"#01-estrategia--oferta-e-preco\">oferta e preço\u003c/a>: R$ 6,00 por aluno por mês. \u003cstrong>A definir\u003c/strong> se o preço aparece na página ou só na proposta."]},{"id":"03-canais--plano-de-canais","rel":"03-canais/plano-de-canais.md","group":"Canais","title":"Plano de canais","status":{"key":"hipotese","label":"Hipótese"},"html":"\u003ch1>Plano de canais\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Hipótese. Prioridade e orçamento A definir.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Canal\u003c/th>\n\u003cth>Papel\u003c/th>\n\u003cth>Para quem\u003c/th>\n\u003cth>Situação hoje\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Contato direto com redes conhecidas\u003c/td>\n\u003ctd>Canal principal do primeiro ciclo: a equipe tem relação próxima com várias redes em Guarulhos e São Paulo\u003c/td>\n\u003ctd>Dono ou diretor(a) da rede\u003c/td>\n\u003ctd>Definido em 31/10/2026; lista de redes fora do repositório\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Landing (\u00
