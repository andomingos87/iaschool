<!DOCTYPE html>
<!--
  Preview entry for the design system. Renders a living style guide that
  showcases the tokens (tokens.json) and the current component library.
  Fonts are loaded as non-blocking <link> tags (not CSS @import, which is
  render-blocking). Trim this font bundle to the families your tokens use.
-->
<html lang="pt-BR" class="dark" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>IAsport Design System</title>
    <meta name="description" content="IAsport Design System — design system preview built on Replit." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Prometo (fonte da marca) é embutida via @font-face no CSS gerado; aqui só os fallbacks. -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"></noscript>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
