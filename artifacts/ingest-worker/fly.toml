# ingest-worker na Fly.io (spec §11): um app por worker, escala manual.
# Escalar com mais MÁQUINAS (`fly scale count N`), não com mais processos.
#
# Deploy (contexto = raiz do repositório):
#   fly deploy --config artifacts/ingest-worker/fly.toml \
#              --dockerfile artifacts/ingest-worker/Dockerfile .
# Segredos: SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY via `fly secrets set`.

app = "iaschool-ingest-worker"
primary_region = "gru"
# Tempo para o SIGTERM drenar o lote em voo (16 jobs a ≤ 300 ms cada).
kill_timeout = 120

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  WORKER_CONCURRENCY = "8"
  CLAIM_BATCH = "16"
  LEASE_SECONDS = "120"

# Worker faz polling: nunca pode dormir por falta de tráfego HTTP.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
