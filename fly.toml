# api-server na Fly.io: geração unitária de arte. O app web chega aqui pelo
# rewrite `/api` de artifacts/iaschool-app/vercel.json — renomear o app obriga
# a mudar os dois arquivos no mesmo commit.
#
# Deploy (contexto = raiz do repositório):
#   fly deploy --remote-only --ha=false
# Segredos via `fly secrets set`: SUPABASE_URL, SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY e OPENAI_API_KEY.

app = "iaschool-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"

# Diferente dos workers, a API só trabalha quando alguém pede: pode dormir.
[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
