kind = "design-system"
previewPath = "/iasport/"
title = "IAsport Design System"
description = "Design system da marca IAsport — plataforma web de métricas, dados esportivos e geração de imagens para atletas, treinadores e escolinhas de futebol. Paleta cinza escuro, cinza azulado e verde neon, tipografia Prometo, modo escuro padrão com modo claro disponível."
version = "1.0.0"
id = "artifacts/iasport"
router = "path"

[[services]]
name = "web"
paths = [ "/iasport/" ]
localPort = 21906

[services.development]
run = "pnpm --filter @workspace/iasport run dev"

[services.env]
PORT = "21906"
BASE_PATH = "/iasport/"
