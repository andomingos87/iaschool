kind = "web"
previewPath = "/"
title = "R9 Escolinhas"
description = "Aplicação web em pt-BR para a rede de franquias de escolinhas de futebol R9. Permite cadastrar alunos, clubes, referências de posts e métricas, e gerar imagens estilo post de Instagram com foto e métricas do aluno para compartilhar via WhatsApp. Construída sobre o design system IAsport, com camada de dados mock preparada para futura integração com Supabase."
version = "1.0.0"
id = "artifacts/r9-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26022

[services.development]
run = "pnpm --filter @workspace/r9-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/r9-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/r9-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26022"
BASE_PATH = "/"
