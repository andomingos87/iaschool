=\"../docs/pendencias-producao.md\" target=\"_blank\" data-externo=\"1\">pendências de produção\u003c/a>). Nenhuma\npeça deve anunciar entrega por WhatsApp. Usar WhatsApp para conversa\ncomercial um a um com escolas é outra decisão, que cabe a vocês.\u003c/p>\n\u003ch2>Peças por canal\u003c/h2>\n\u003cp>Cada canal novo ganha uma subpasta aqui (\u003ccode>instagram/\u003c/code>, \u003ccode>linkedin/\u003c/code>, \u003ccode>email/\u003c/code>)\nquando for ativado. Hoje só existe \u003ccode>landing/\u003c/code>.\u003c/p>\n","text":" Plano de canais Status: Hipótese. Prioridade e orçamento A definir. Canal Papel Para quem Situação hoje Contato direto com redes conhecidas Canal principal do primeiro ciclo: a equipe tem relação próxima com várias redes em Guarulhos e São Paulo Dono ou diretor a da rede Definido em 31/10/2026; lista de redes fora do repositório Landing aiescola.com.br Explicar e gerar pedido de demonstração Direção e coordenação Código pronto, não publicado. Falta domínio, contato de demo e revisão jurídica do texto Demonstração ao vivo Principal ferramenta de venda Direção e coordenação Roteiro ../04 vendas/roteiro demonstracao.md rascunhado LinkedIn Autoridade com direção e mantenedores Direção A definir Instagram Presença e confiança com escolas e famílias Coordenação, famílias A definir. Sem foto de criança E mail Seguimento depois da demo Quem pediu demo A definir Eventos e associações do setor Contato direto com gestores Direção A definir: quais eventos e associações na região escolhida Indicação entre escolas Crescimento depois dos primeiros clientes Direção Depende de clientes Busca SEO e anúncios Captar quem procura solução Coordenação Palavras chave em copy da landing landing/copy landing v2.md WhatsApp O envio de fotos pelo WhatsApp dentro do produto está desligado para uso comercial pendências de produção ../../docs/pendencias producao.md . Nenhuma peça deve anunciar entrega por WhatsApp. Usar WhatsApp para conversa comercial um a um com escolas é outra decisão, que cabe a vocês. Peças por canal Cada canal novo ganha uma subpasta aqui instagram/ , linkedin/ , email/ quando for ativado. Hoje só existe landing/ . ","pend":["LinkedIn · Autoridade com direção e mantenedores · Direção · A definir","Instagram · Presença e confiança com escolas e famílias · Coordenação, famílias · A definir. Sem foto de criança","E-mail · Seguimento depois da demo · Quem pediu demo · A definir","Eventos e associações do setor · Contato direto com gestores · Direção · A definir: quais eventos e associações na região escolhida"]},{"id":"04-vendas--objecoes","rel":"04-vendas/objecoes.md","group":"Vendas","title":"Objeções","status":{"key":"hipotese","label":"Hipótese"},"html":"\u003ch1>Objeções\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Hipótese. Respostas só com o que o produto faz hoje. Atualizar com\nas objeções reais das entrevistas e demonstrações.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Objeção\u003c/th>\n\u003cth>Resposta\u003c/th>\n\u003cth>Cuidado\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>&quot;Reconhecimento facial de criança? As famílias vão reclamar.&quot;\u003c/td>\n\u003ctd>Só entra no reconhecimento o aluno cujo responsável autorizou. A autorização é separada por finalidade e pode ser retirada, e aí o reconhecimento para.\u003c/td>\n\u003ctd>Não dizer que está &quot;de acordo com a lei&quot;: não há homologação jurídica\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Já usamos grupo e Drive, e é de graça.&quot;\u003c/td>\n\u003ctd>O custo está nas horas separando foto e no risco de foto no grupo errado. E não fica registro de quem autorizou.\u003c/td>\n\u003ctd>Não citar número de horas sem medição\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;E se a IA errar?&quot;\u003c/td>\n\u003ctd>Ela erra. Por isso uma pessoa da escola confirma cada sugestão antes de qualquer entrega.\u003c/td>\n\u003ctd>Mostrar uma correção na demo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Vou ter que cadastrar milhares de alunos um por um?&quot;\u003c/td>\n\u003ctd>A entrada será por importação de planilha.\u003c/td>\n\u003ctd>Decidida, ainda não construída: não dar data sem o produto confirmar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Dá para ver a rede inteira num lugar só?&quot;\u003c/td>\n\u003ctd>Cada unidade tem seus eventos e sua equipe, e a mesma pessoa pode alternar entre unidades.\u003c/td>\n\u003ctd>Não há painel da rede inteira hoje\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;A família precisa baixar aplicativo?&quot;\u003c/td>\n\u003ctd>Não. Abre o link no celular e baixa as fotos.\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Outras crianças aparecem nas fotos que eu envio?&quot;\u003c/td>\n\u003ctd>Em foto de grupo, sim. A escola escolhe na revisão quais fotos entram em cada entrega.\u003c/td>\n\u003ctd>Resposta depende da homologação do termo de entrega\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Quanto custa?&quot;\u003c/td>\n\u003ctd>R$ 6,00 por aluno por mês, com desconto em contrato trimestral, semestral e anual. Artes com IA incluídas até uma cota. Ver \u003ca href=\"#01-estrategia--oferta-e-preco\">oferta e preço\u003c/a>.\u003c/td>\n\u003ctd>Percentuais de desconto e tamanho da cota ainda abertos\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Quando posso usar com as fotos dos meus alunos?&quot;\u003c/td>\n\u003ctd>Depois que as pendências de produção fecharem. Antes disso, piloto com material de demonstração.\u003c/td>\n\u003ctd>Não dar data sem decisão de vocês\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Onde ficam os dados e por quanto tempo?&quot;\u003c/td>\n\u003ctd>A definir com o jurídico. A escola escolhe o prazo de guarda de cada evento.\u003c/td>\n\u003ctd>Encaminhar ao material para jurídico (A definir)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","text":" Objeções Status: Hipótese. Respostas só com o que o produto faz hoje. Atualizar com as objeções reais das entrevistas e demonstrações. Objeção Resposta Cuidado \"Reconhecimento facial de criança? As famílias vão reclamar.\" Só entra no reconhecimento o aluno cujo responsável autorizou. A autorização é separada por finalidade e pode ser retirada, e aí o reconhecimento para. Não dizer que está \"de acordo com a lei\": não há homologação jurídica \"Já usamos grupo e Drive, e é de graça.\" O custo está nas horas separando foto e no risco de foto no grupo errado. E não fica registro de quem autorizou. Não citar número de horas sem medição \"E se a IA errar?\" Ela erra. Por isso uma pessoa da escola confirma cada sugestão antes de qualquer entrega. Mostrar uma correção na demo \"Vou ter que cadastrar milhares de alunos um por um?\" A entrada será por importação de planilha. Decidida, ainda não construída: não dar data sem o produto confirmar \"Dá para ver a rede inteira num lugar só?\" Cada unidade tem seus eventos e sua equipe, e a mesma pessoa pode alternar entre unidades. Não há painel da rede inteira hoje \"A família precisa baixar aplicativo?\" Não. Abre o link no celular e baixa as fotos. \"Outras crianças aparecem nas fotos que eu envio?\" Em foto de grupo, sim. A escola escolhe na revisão quais fotos entram em cada entrega. Resposta depende da homologação do termo de entrega \"Quanto custa?\" R$ 6,00 por aluno por mês, com desconto em contrato trimestral, semestral e anual. Artes com IA incluídas até uma cota. Ver oferta e preço ../01 estrategia/oferta e preco.md . Percentuais de desconto e tamanho da cota ainda abertos \"Quando posso usar com as fotos dos meus alunos?\" Depois que as pendências de produção fecharem. Antes disso, piloto com material de demonstração. Não dar data sem decisão de vocês \"Onde ficam os dados e por quanto tempo?\" A definir com o jurídico. A escola escolhe o prazo de guarda de cada evento. Encaminhar ao material para jurídico A definir ","pend":["&quot;Onde ficam os dados e por quanto tempo?&quot; · A definir com o jurídico. A escola escolhe o prazo de guarda de cada evento. · Encaminhar ao material para jurídico (A definir)"]},{"id":"04-vendas--roteiro-demonstracao","rel":"04-vendas/roteiro-demonstracao.md","group":"Vendas","title":"Roteiro da demonstração","status":{"key":"hipotese","label":"Hipótese"},"html":"\u003ch1>Roteiro da demonstração\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Hipótese. Base: demonstrações gravadas em \u003ccode>videos/\u003c/code> (08, 11 e\n16/10/2026). Usar só o modo demonstração do app ou material sintético.\u003c/p>\n\u003ch2>Antes da conversa\u003c/h2>\n\u003cul>\n\u003cli>Escola de demonstração com turmas, alunos fictícios e fotos sintéticas.\u003c/li>\n\u003cli>Um evento já processado, com sugestões para revisar e uma sugestão errada.\u003c/li>\n\u003cli>Um álbum de família pronto para abrir em janela privada.\u003c/li>\n\u003cli>Nada de foto real de criança, nem da escola que está assistindo.\u003c/li>\n\u003c/ul>\n\u003ch2>Ordem\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Passo\u003c/th>\n\u003cth>O que mostrar\u003c/th>\n\u003cth>O que dizer\u003c/th>\n\u003cth>Tempo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1. Situação atual\u003c/td>\n\u003ctd>Nada na tela\u003c/td>\n\u003ctd>Perguntar como a escola entrega as fotos hoje e o que dá errado\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2. Cadastro e autorização\u003c/td>\n\u003ctd>Ficha do aluno com autorizações por finalidade\u003c/td>\n\u003ctd>O responsável autoriza reconhecimento e recebimento, cada um separado, e pode retirar\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3. Evento e upload\u003c/td>\n\u003ctd>Criação do evento e envio das fotos\u003c/td>\n\u003ctd>O evento inteiro sobe de uma vez\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4. Revisão\u003c/td>\n\u003ctd>Fila com sugestões, incluindo uma errada\u003c/td>\n\u003ctd>A IA erra, por isso nada sai sem alguém conferir\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5. Entrega\u003c/td>\n\u003ctd>Preparo e aprovação da entrega\u003c/td>\n\u003ctd>A escola aprova o que vai para cada família\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6. Visão da família\u003c/td>\n\u003ctd>Álbum aberto no celular, download em ZIP\u003c/td>\n\u003ctd>Sem app, só o link\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7. Artes (opcional)\u003c/td>\n\u003ctd>Uma arte gerada a partir do modelo da escola\u003c/td>\n\u003ctd>Mostrar o aviso de imagem feita por IA\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8. Próximo passo\u003c/td>\n\u003ctd>Nada na tela\u003c/td>\n\u003ctd>Propor piloto com material de demonstração\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Tempo de cada passo: A definir, depois das primeiras demonstrações.\u003c/p>\n\u003ch2>O que não fazer\u003c/h2>\n\u003cul>\n\u003cli>Não demonstrar envio por WhatsApp: o envio está desligado para uso comercial.\u003c/li>\n\u003cli>Não citar &quot;5.000 fotos por vez&quot;, &quot;em minutos&quot; nem taxa de acerto: nenhum foi medido.\u003c/li>\n\u003cli>Não afirmar que o produto está &quot;de acordo com o ECA Digital&quot; ou com a LGPD.\u003c/li>\n\u003c/ul>\n\u003ch2>Pontos fracos para preparar resposta\u003c/h2>\n\u003cul>\n\u003cli>Cadastro de aluno é um a um: não há cadastro em massa. Ver \u003ca href=\"#04-vendas--objecoes\">objeções\u003c/a>.\u003c/li>\n\u003cli>A revisão de rostos ainda é repetitiva em evento grande (vídeo de 11/10/2026 pede &quot;selecionar todos&quot;). Conferir se já mudou antes da demo.\u003c/li>\n\u003c/ul>\n","text":" Roteiro da demonstração Status: Hipótese. Base: demonstrações gravadas em videos/ 08, 11 e 16/10/2026 . Usar só o modo demonstração do app ou material sintético. Antes da conversa Escola de demonstração com turmas, alunos fictícios e fotos sintéticas. Um evento já processado, com sugestões para revisar e uma sugestão errada. Um álbum de família pronto para abrir em janela privada. Nada de foto real de criança, nem da escola que está assistindo. Ordem Passo O que mostrar O que dizer Tempo 1. Situação atual Nada na tela Perguntar como a escola entrega as fotos hoje e o que dá errado — 2. Cadastro e autorização Ficha do aluno com autorizações por finalidade O responsável autoriza reconhecimento e recebimento, cada um separado, e pode retirar — 3. Evento e upload Criação do evento e envio das fotos O evento inteiro sobe de uma vez — 4. Revisão Fila com sugestões, incluindo uma errada A IA erra, por isso nada sai sem alguém conferir — 5. Entrega Preparo e aprovação da entrega A escola aprova o que vai para cada família — 6. Visão da família Álbum aberto no celular, download em ZIP Sem app, só o link — 7. Artes opcional Uma arte gerada a partir do modelo da escola Mostrar o aviso de imagem feita por IA — 8. Próximo passo Nada na tela Propor piloto com material de demonstração — Tempo de cada passo: A definir, depois das primeiras demonstrações. O que não fazer Não demonstrar envio por WhatsApp: o envio está desligado para uso comercial. Não citar \"5.000 fotos por vez\", \"em minutos\" nem taxa de acerto: nenhum foi medido. Não afirmar que o produto está \"de acordo com o ECA Digital\" ou com a LGPD. Pontos fracos para preparar resposta Cadastro de aluno é um a um: não há cadastro em massa. Ver objeções objecoes.md . A revisão de rostos ainda é repetitiva em evento grande vídeo de 11/10/2026 pede \"selecionar todos\" . Conferir se já mudou antes da demo. ","pend":[]},{"id":"05-conteudo--calendario-editorial","rel":"05-conteudo/calendario-editorial.md","group":"Conteúdo","title":"Calendário editorial","status":{"key":"hipotese","label":"Hipótese"},"html":"\u003ch1>Calendário editorial\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Hipótese. Temas por momento do ano letivo. Datas e canais A definir.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Mês\u003c/th>\n\u003cth>Momento da escola\u003c/th>\n\u003cth>Tema para direção e coordenação\u003c/th>\n\u003cth>Tema para famílias\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Novembro e dezembro\u003c/td>\n\u003ctd>Formatura e fim de ano; planejamento de 2027\u003c/td>\n\u003ctd>Como planejar a entrega de fotos do ano que vem\u003c/td>\n\u003ctd>Como receber as fotos da formatura\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Janeiro e fevereiro\u003c/td>\n\u003ctd>Matrícula e volta às aulas\u003c/td>\n\u003ctd>Autorização de imagem junto com a matrícula: o que perguntar à família\u003c/td>\n\u003ctd>O que você autoriza quando a escola pede a imagem do seu filho\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Março e abril\u003c/td>\n\u003ctd>Rotina\u003c/td>\n\u003ctd>Quanto tempo a equipe gasta separando fotos\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Maio\u003c/td>\n\u003ctd>Dia das Mães\u003c/td>\n\u003ctd>Checklist para entregar fotos do evento sem grupo\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Junho e julho\u003c/td>\n\u003ctd>Festa junina\u003c/td>\n\u003ctd>O evento com mais fotos do ano\u003c/td>\n\u003ctd>Onde estão as fotos da festa junina\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agosto\u003c/td>\n\u003ctd>Dia dos Pais\u003c/td>\n\u003ctd>Foto de família no evento: cuidados\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Setembro\u003c/td>\n\u003ctd>Rotina\u003c/td>\n\u003ctd>Retirada de autorização: como a escola deve agir\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Outubro\u003c/td>\n\u003ctd>Dia das Crianças\u003c/td>\n\u003ctd>Imagem de criança na internet: o que a escola deve evitar\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2>Pautas candidatas\u003c/h2>\n\u003cul>\n\u003cli>Grupo da turma ou álbum por família: o que muda para a escola.\u003c/li>\n\u003cli>Cinco perguntas antes de postar foto de aluno.\u003c/li>\n\u003cli>O que o ECA Digital muda para fotos de alunos. \u003cstrong>Pede revisão jurídica.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch2>Regras\u003c/h2>\n\u003cul>\n\u003cli>Toda pauta passa pelas \u003ca href=\"#07-conformidade--regras-de-comunicacao\">regras de comunicação\u003c/a>.\u003c/li>\n\u003cli>Imagem só como manda a \u003ca href=\"#02-marca--identidade-visual\">identidade visual\u003c/a>: sem foto real de criança.\u003c/li>\n\u003c/ul>\n","text":" Calendário editorial Status: Hipótese. Temas por momento do ano letivo. Datas e canais A definir. Mês Momento da escola Tema para direção e coordenação Tema para famílias Novembro e dezembro Formatura e fim de ano; planejamento de 2027 Como planejar a entrega de fotos do ano que vem Como receber as fotos da formatura Janeiro e fevereiro Matrícula e volta às aulas Autorização de imagem junto com a matrícula: o que perguntar à família O que você autoriza quando a escola pede a imagem do seu filho Março e abril Rotina Quanto tempo a equipe gasta separando fotos Maio Dia das Mães Checklist para entregar fotos do evento sem grupo Junho e julho Festa junina O evento com mais fotos do ano Onde estão as fotos da festa junina Agosto Dia dos Pais Foto de família no evento: cuidados Setembro Rotina Retirada de autorização: como a escola deve agir Outubro Dia das Crianças Imagem de criança na internet: o que a escola deve evitar Pautas candidatas Grupo da turma ou álbum por família: o que muda para a escola. Cinco perguntas antes de postar foto de aluno. O que o ECA Digital muda para fotos de alunos. Pede revisão jurídica. Regras Toda pauta passa pelas regras de comunicação ../07 conformidade/regras de comunicacao.md . Imagem só como manda a identidade visual ../02 marca/identidade visual.md : sem foto real de criança. ","pend":[]},{"id":"06-pesquisa--roteiro-entrevista","rel":"06-pesquisa/roteiro-entrevista.md","group":"Pesquisa","title":"Roteiro de entrevista com escolas","status":{"key":"outro","label":"Pronto para uso"},"html":"\u003ch1>Roteiro de entrevista com escolas\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Pronto para uso.\u003c/p>\n\u003cp>\u003cstrong>Objetivo:\u003c/strong> trocar as hipóteses de \u003ca href=\"#01-estrategia--publico-e-icp\">público\u003c/a>,\n\u003ca href=\"#01-estrategia--personas\">personas\u003c/a> e \u003ca href=\"#01-estrategia--oferta-e-preco\">preço\u003c/a>\npor evidência. Meta inicial de entrevistas: A definir.\u003c/p>\n\u003ch2>Antes\u003c/h2>\n\u003cul>\n\u003cli>Peça permissão para anotar ou gravar.\u003c/li>\n\u003cli>Não colete nome, foto ou dado de aluno. As anotações ficam sem dado pessoal da escola nem das famílias.\u003c/li>\n\u003cli>Não mostre o produto antes da parte 4: primeiro entenda como a escola trabalha hoje.\u003c/li>\n\u003c/ul>\n\u003ch2>1. Escola e contexto\u003c/h2>\n\u003col>\n\u003cli>Quantos alunos e quais etapas de ensino?\u003c/li>\n\u003cli>Quem cuida da comunicação com as famílias?\u003c/li>\n\u003cli>Quais ferramentas a escola usa hoje para falar com as famílias?\u003c/li>\n\u003c/ol>\n\u003ch2>2. Fotos de evento hoje\u003c/h2>\n\u003col start=\"4\">\n\u003cli>Quantos eventos com foto por ano? Quais são os maiores?\u003c/li>\n\u003cli>Quem tira as fotos? Quantas fotos sai num evento grande?\u003c/li>\n\u003cli>Como as fotos chegam às famílias hoje? Conte o último evento.\u003c/li>\n\u003cli>Quanto tempo a equipe gasta nisso?\u003c/li>\n\u003cli>Já teve reclamação de família sobre foto? O que aconteceu?\u003c/li>\n\u003c/ol>\n\u003ch2>3. Autorização de imagem\u003c/h2>\n\u003col start=\"9\">\n\u003cli>Como a escola pede autorização de uso de imagem hoje?\u003c/li>\n\u003cli>Onde essa autorização fica guardada? Alguém consulta antes de enviar foto?\u003c/li>\n\u003cli>Já aconteceu de uma família retirar a autorização? Como foi?\u003c/li>\n\u003c/ol>\n\u003ch2>4. Reação ao produto\u003c/h2>\n\u003col start=\"12\">\n\u003cli>(Mostrar o fluxo) O que parece útil? O que preocupa?\u003c/li>\n\u003cli>Reconhecimento facial: como as famílias da escola reagiriam?\u003c/li>\n\u003cli>As artes com IA por aluno ajudam ou atrapalham?\u003c/li>\n\u003c/ol>\n\u003ch2>5. Compra\u003c/h2>\n\u003col start=\"15\">\n\u003cli>Quem decide uma compra assim? Quem mais precisa aprovar?\u003c/li>\n\u003cli>Quanto a escola gasta hoje com fotos de evento?\u003c/li>\n\u003cli>Que faixa de preço parece justa? Por aluno, por mês ou por evento?\u003c/li>\n\u003cli>O que faria a escola testar no próximo evento?\u003c/li>\n\u003c/ol>\n\u003ch2>Registro das entrevistas\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Data\u003c/th>\n\u003cth>Etapa e porte\u003c/th>\n\u003cth>Cargo de quem falou\u003c/th>\n\u003cth>Principais dores\u003c/th>\n\u003cth>Objeções\u003c/th>\n\u003cth>Disposição a pagar\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","text":" Roteiro de entrevista com escolas Status: Pronto para uso. Objetivo: trocar as hipóteses de público ../01 estrategia/publico e icp.md , personas ../01 estrategia/personas.md e preço ../01 estrategia/oferta e preco.md por evidência. Meta inicial de entrevistas: A definir. Antes Peça permissão para anotar ou gravar. Não colete nome, foto ou dado de aluno. As anotações ficam sem dado pessoal da escola nem das famílias. Não mostre o produto antes da parte 4: primeiro entenda como a escola trabalha hoje. 1. Escola e contexto 1. Quantos alunos e quais etapas de ensino? 2. Quem cuida da comunicação com as famílias? 3. Quais ferramentas a escola usa hoje para falar com as famílias? 2. Fotos de evento hoje 4. Quantos eventos com foto por ano? Quais são os maiores? 5. Quem tira as fotos? Quantas fotos sai num evento grande? 6. Como as fotos chegam às famílias hoje? Conte o último evento. 7. Quanto tempo a equipe gasta nisso? 8. Já teve reclamação de família sobre foto? O que aconteceu? 3. Autorização de imagem 9. Como a escola pede autorização de uso de imagem hoje? 10. Onde essa autorização fica guardada? Alguém consulta antes de enviar foto? 11. Já aconteceu de uma família retirar a autorização? Como foi? 4. Reação ao produto 12. Mostrar o fluxo O que parece útil? O que preocupa? 13. Reconhecimento facial: como as famílias da escola reagiriam? 14. As artes com IA por aluno ajudam ou atrapalham? 5. Compra 15. Quem decide uma compra assim? Quem mais precisa aprovar? 16. Quanto a escola gasta hoje com fotos de evento? 17. Que faixa de preço parece justa? Por aluno, por mês ou por evento? 18. O que faria a escola testar no próximo evento? Registro das entrevistas Data Etapa e porte Cargo de quem falou Principais dores Objeções Disposição a pagar ","pend":[]},{"id":"07-conformidade--regras-de-comunicacao","rel":"07-conformidade/regras-de-comunicacao.md","group":"Conformidade","title":"Regras de comunicação","status":{"key":"definido","label":"Definido"},"html":"\u003ch1>Regras de comunicação\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Definido. Vale para landing, post, e-mail, apresentação e demo.\u003c/p>\n\u003cp>Este arquivo é assessoria técnica de produto, não parecer jurídico. Textos\nsobre lei, autorização e dados de criança passam por revisão jurídica antes de\npublicar.\u003c/p>\n\u003ch2>Regras\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Sem foto real de criança ou adolescente\u003c/strong> em nenhuma peça. Regra do projeto\naté as \u003ca href=\"../docs/pendencias-producao.md\" target=\"_blank\" data-externo=\"1\">pendências de produção\u003c/a> fecharem.\u003c/li>\n\u003cli>\u003cstrong>Sem declarar conformidade\u003c/strong> com o ECA Digital, a LGPD ou qualquer lei. Descreva\no que o produto faz (autorização por finalidade, revogação, registro).\u003c/li>\n\u003cli>\u003cstrong>Sem número que não foi medido:\u003c/strong> volume, velocidade, taxa de acerto, horas economizadas.\u003c/li>\n\u003cli>\u003cstrong>Sem depoimento, logo ou caso inventado.\u003c/strong> Prova social só com cliente real e autorização escrita.\u003c/li>\n\u003cli>\u003cstrong>Sem anunciar entrega por WhatsApp.\u003c/strong> O envio comercial está desligado.\u003c/li>\n\u003cli>\u003cstrong>Sem prometer recurso que não está publicado.\u003c/strong> Exemplo: álbum agrupado por evento, cadastro em massa.\u003c/li>\n\u003cli>\u003cstrong>Arte com IA\u003c/strong> sempre descrita como imagem gerada por inteligência artificial.\u003c/li>\n\u003cli>\u003cstrong>Convite à ação\u003c/strong> é demonstração ou piloto com material de teste, não &quot;use com seus alunos agora&quot;.\u003c/li>\n\u003c/ol>\n\u003ch2>Achados na landing atual\u003c/h2>\n\u003cp>Revisão de 31/10/2026 em \u003ca href=\"../artifacts/iaschool-app/src/pages/landing.tsx\" target=\"_blank\" data-externo=\"1\">\u003ccode>landing.tsx\u003c/code>\u003c/a>,\npela skill \u003ccode>eca-digital\u003c/code>. Proposta de texto em\n\u003ca href=\"#03-canais--landing--copy-landing-v2\">copy da landing v2\u003c/a>.\u003c/p>\n\u003cpre>\u003ccode>[BLOQUEIA] &quot;Nunca as de outro aluno&quot; contradiz a entrega com fotos nítidas\nBase: Lei 15.211/2025, art. 16 (informar riscos a pais e responsáveis) e art. 3º; LGPD, art. 14 (melhor interesse)\nEvidência: artifacts/iaschool-app/src/pages/landing.tsx:278 e :303-305; entrega atual usa fotos nítidas, sem desfoque (docs/pendencias-producao.md, item 1)\nRisco: a família lê que nenhuma outra criança aparece, mas colegas aparecem em foto de grupo; a família do colega não sabe que a imagem do filho vai para outra casa\nCorreção mínima: trocar o texto pelo da copy v2 e homologar o novo termo de entrega antes de publicar\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>[CORRIGIR] Afirmação de que a plataforma segue as regras do ECA Digital\nBase: regra da skill eca-digital (não declarar conformidade); homologação jurídica pendente (docs/pendencias-producao.md, item 5)\nEvidência: artifacts/iaschool-app/src/pages/landing.tsx:490\nRisco: promessa de conformidade que ninguém homologou, lida pela escola como garantia\nCorreção mínima: remover a frase até a revisão jurídica; descrever os controles no lugar\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>[CORRIGIR] &quot;Toda imagem gerada por IA sai identificada como tal&quot;\nBase: Decreto 12.880/2026, art. 11, I (transparência do caráter sintético), aplicabilidade a confirmar\nEvidência: aviso só na mensagem de compartilhamento, artifacts/iaschool-app/src/config/iaschool.ts:47-48; promessa em landing.tsx:260 e :279\nRisco: a imagem baixada circula sem aviso, e a página promete mais do que o produto faz\nCorreção mínima: dizer que a mensagem de compartilhamento avisa; marcar a própria imagem é decisão de produto à parte\n\u003c/code>\u003c/pre>\n\u003ch2>Outras promessas sem base no produto\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Trecho\u003c/th>\n\u003cth>Arquivo\u003c/th>\n\u003cth>Problema\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>&quot;separar milhares de fotos&quot;\u003c/td>\n\u003ctd>\u003ccode>landing.tsx:248\u003c/code>\u003c/td>\n\u003ctd>Volume não medido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;filtra por evento&quot;, &quot;agrupadas por evento&quot;\u003c/td>\n\u003ctd>\u003ccode>landing.tsx:241\u003c/code> e \u003ccode>:255\u003c/code>\u003c/td>\n\u003ctd>Álbum agrupado por evento só existe no código local\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;baixam quando quiserem&quot;\u003c/td>\n\u003ctd>\u003ccode>landing.tsx:286\u003c/code>\u003c/td>\n\u003ctd>Acesso tem prazo e a escola define a retenção\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Leve o próximo evento da sua escola&quot;\u003c/td>\n\u003ctd>\u003ccode>landing.tsx:549\u003c/code>\u003c/td>\n\u003ctd>Foto real de aluno ainda não é permitida\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;As fotos do evento ficam prontas em minutos&quot;\u003c/td>\n\u003ctd>PDF de cores e tipografia da marca\u003c/td>\n\u003ctd>Texto de exemplo do PDF; tempo não medido, não reutilizar\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","text":" Regras de comunicação Status: Definido. Vale para landing, post, e mail, apresentação e demo. Este arquivo é assessoria técnica de produto, não parecer jurídico. Textos sobre lei, autorização e dados de criança passam por revisão jurídica antes de publicar. Regras 1. Sem foto real de criança ou adolescente em nenhuma peça. Regra do projeto até as pendências de produção ../../docs/pendencias producao.md fecharem. 2. Sem declarar conformidade com o ECA Digital, a LGPD ou qualquer lei. Descreva o que o produto faz autorização por finalidade, revogação, registro . 3. Sem número que não foi medido: volume, velocidade, taxa de acerto, horas economizadas. 4. Sem depoimento, logo ou caso inventado. Prova social só com cliente real e autorização escrita. 5. Sem anunciar entrega por WhatsApp. O envio comercial está desligado. 6. Sem prometer recurso que não está publicado. Exemplo: álbum agrupado por evento, cadastro em massa. 7. Arte com IA sempre descrita como imagem gerada por inteligência artificial. 8. Convite à ação é demonstração ou piloto com material de teste, não \"use com seus alunos agora\". Achados na landing atual Revisão de 31/10/2026 em landing.tsx ../../artifacts/iaschool app/src/pages/landing.tsx , pela skill eca digital . Proposta de texto em copy da landing v2 ../03 canais/landing/copy landing v2.md . BLOQUEIA \"Nunca as de outro aluno\" contradiz a entrega com fotos nítidas Base: Lei 15.211/2025, art. 16 informar riscos a pais e responsáveis e art. 3º; LGPD, art. 14 melhor interesse Evidência: artifacts/iaschool app/src/pages/landing.tsx:278 e :303 305; entrega atual usa fotos nítidas, sem desfoque docs/pendencias producao.md, item 1 Risco: a família lê que nenhuma outra criança aparece, mas colegas aparecem em foto de grupo; a família do colega não sabe que a imagem do filho vai para outra casa Correção mínima: trocar o texto pelo da copy v2 e homologar o novo termo de entrega antes de publicar CORRIGIR Afirmação de que a plataforma segue as regras do ECA Digital Base: regra da skill eca digital não declarar conformidade ; homologação jurídica pendente docs/pendencias producao.md, item 5 Evidência: artifacts/iaschool app/src/pages/landing.tsx:490 Risco: promessa de conformidade que ninguém homologou, lida pela escola como garantia Correção mínima: remover a frase até a revisão jurídica; descrever os controles no lugar CORRIGIR \"Toda imagem gerada por IA sai identificada como tal\" Base: Decreto 12.880/2026, art. 11, I transparência do caráter sintético , aplicabilidade a confirmar Evidência: aviso só na mensagem de compartilhamento, artifacts/iaschool app/src/config/iaschool.ts:47 48; promessa em landing.tsx:260 e :279 Risco: a imagem baixada circula sem aviso, e a página promete mais do que o produto faz Correção mínima: dizer que a mensagem de compartilhamento avisa; marcar a própria imagem é decisão de produto à parte Outras promessas sem base no produto Trecho Arquivo Problema \"separar milhares de fotos\" landing.tsx:248 Volume não medido \"filtra por evento\", \"agrupadas por evento\" landing.tsx:241 e :255 Álbum agrupado por evento só existe no código local \"baixam quando quiserem\" landing.tsx:286 Acesso tem prazo e a escola define a retenção \"Leve o próximo evento da sua escola\" landing.tsx:549 Foto real de aluno ainda não é permitida \"As fotos do evento ficam prontas em minutos\" PDF de cores e tipografia da marca Texto de exemplo do PDF; tempo não medido, não reutilizar ","pend":[]}],"gerado":"31/10/2026, 13:16:39"}</script>
<script>
(() => {
  const { docs, gerado } = JSON.parse(document.getElementById("data").textContent);
  const byId = Object.fromEntries(docs.map((d) => [d.id, d]));
  const home = docs.find((d) => d.id === "README");
  const navDocs = docs.filter((d) => d !== home);
  const STATUS = { definido: "Definido", parcial: "Definido em parte", hipotese: "Hipótese", adefinir: "A definir", rascunho: "Rascunho", indice: "Índice", outro: "Outro" };
  const WORDS = { "Definido": "definido", "Hipótese": "hipotese", "A definir": "adefinir" };
  const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const num = new Intl.NumberFormat("pt-BR");
  // localStorage falha em data: URL e em janela privada; a memória segura a sessão atual.
  const mem = {};
  const store = {
    get(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch {} return mem[k] ?? null; },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch {} },
  };
  const hash = (s) => { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const main = document.getElementById("main");
  const side = document.getElementById("side");
  const q = document.getElementById("q");
  let filters = new Set();

  // Tema
  const root = document.documentElement;
  const savedTheme = store.get("mk-theme");
  if (savedTheme) root.dataset.theme = savedTheme;
  document.getElementById("theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    store.set("mk-theme", root.dataset.theme);
  });

  // Menu no celular
  const menu = document.getElementById("menu");
  menu.addEventListener("click", () => {
    const open = side.classList.toggle("open");
    menu.setAttribute("aria-expanded", String(open));
  });

  const pendKey = (d, t) => "mk-pend-" + hash(d.id + "|" + t);
  const pendTotal = () => navDocs.concat(home).reduce((n, d) => n + d.pend.length, 0);
  const pendDone = () => navDocs.concat(home).reduce((n, d) => n + d.pend.filter((t) => store.get(pendKey(d, t)) === "1").length, 0);

  function buildNav() {
    const present = [...new Set(navDocs.map((d) => d.status.key))];
    let html = '<div class="filters" role="group" aria-label="Filtrar por status">' +
      present.map((k) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filters.has(k)}">${STATUS[k]}</button>`).join("") + "</div>";
    html += `<a class="item" href="#inicio"><span class="t">Visão geral</span></a>`;
    html += `<a class="item" href="#pendencias"><span class="t">Pendências</span><span class="count" id="pcount"></span></a>`;
    const groups = [...new Set(navDocs.map((d) => d.group))];
    for (const g of groups) {
      const items = navDocs.filter((d) => d.group === g && (!filters.size || filters.has(d.status.key)));
      if (!items.length) continue;
      html += `<div class="navgroup"><h3>${esc(g)}</h3>` + items.map((d) =>
        `<a class="item" href="#${d.id}" title="${esc(STATUS[d.status.key])}"><span class="dot ${d.status.key}" aria-hidden="true"></span><span class="t">${esc(d.title)}</span></a>`).join("") + "</div>";
    }
    side.innerHTML = html;
    side.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
      const k = b.dataset.f;
      filters.has(k) ? filters.delete(k) : filters.add(k);
      buildNav(); markCurrent();
    }));
    updateCount();
  }
  function updateCount() {
    const el = document.getElementById("pcount");
    if (el) el.textContent = String(pendTotal() - pendDone());
  }
  // Navegação por estado: o hash da URL não funciona quando a página abre como data: URL.
  let current = decodeURIComponent(location.hash.slice(1)) || "inicio";
  function go(id) {
    current = id;
    try { history.pushState(null, "", "#" + id); } catch {}
    route();
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
    const id = decodeURIComponent(a.getAttribute("href").slice(1));
    if (!id || id === "main") return;
    e.preventDefault();
    go(id);
  });
  addEventListener("popstate", () => { current = decodeURIComponent(location.hash.slice(1)) || "inicio"; route(); });

  function markCurrent() {
    const cur = current;
    side.querySelectorAll("a.item").forEach((a) => {
      if (a.getAttribute("href") === "#" + cur) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function decorate(el) {
    el.querySelectorAll("strong").forEach((s) => {
      const k = WORDS[s.textContent.trim().replace(/[.:]$/, "")];
      if (k) s.classList.add("st-" + k);
    });
    el.querySelectorAll("pre").forEach((p) => {
      const m = p.textContent.match(/^\s*\[(BLOQUEIA|CORRIGIR|OBSERVAR)/);
      if (m) p.classList.add(m[1].toLowerCase());
    });
    el.querySelectorAll('[data-widget="simulador"]').forEach(simulador);
  }

  function highlight(el, term) {
    if (!term) return;
    const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
    nodes.forEach((n) => {
      const span = document.createElement("span");
      span.innerHTML = esc(n.nodeValue).replace(new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
      n.replaceWith(...span.childNodes);
    });
    el.querySelector("mark")?.scrollIntoView({ block: "center" });
  }

  function viewHome() {
    const counts = {};
    navDocs.forEach((d) => (counts[d.status.key] = (counts[d.status.key] || 0) + 1));
    const groups = [...new Set(navDocs.map((d) => d.group))];
    main.innerHTML = `
      <section class="hero">
        <h1>Marketing da AIESCOLA</h1>
        <p>Estratégia, marca, canais, vendas e regras de comunicação. Gerado em ${esc(gerado)} a partir dos arquivos de <code style="background:rgba(255,255,255,.12);color:#fff">marketing/</code>.</p>
        <div class="stats">
          <div class="stat"><b>${navDocs.length}</b><span>documentos</span></div>
          <div class="stat"><b>${(counts.definido || 0) + (counts.parcial || 0)}</b><span>definidos</span></div>
          <div class="stat"><b>${counts.hipotese || 0}</b><span>hipóteses</span></div>
          <div class="stat"><b>${(counts.adefinir || 0) + (counts.rascunho || 0)}</b><span>a definir ou rascunho</span></div>
          <div class="stat"><b id="hp">${pendTotal() - pendDone()}</b><span>pendências abertas</span></div>
        </div>
      </section>
      ${groups.map((g) => `<h2 style="font:700 20px var(--display);margin:28px 0 0">${esc(g)}</h2><div class="grid">` +
        navDocs.filter((d) => d.group === g).map((d) => `
          <a class="card" href="#${d.id}">
            <span class="badge ${d.status.key}">${esc(STATUS[d.status.key])}</span>
            <span class="ct">${esc(d.title)}</span>
            <small>${esc(d.rel)}</small>
            ${d.pend.length ? `<span class="pend">${d.pend.length} ${d.pend.length === 1 ? "pendência" : "pendências"}</span>` : ""}
          </a>`).join("") + "</div>").join("")}
      <article class="doc" style="margin-top:30px">${home.html}</article>`;
    decorate(main);
  }

  function viewDoc(d, term) {
    const i = navDocs.indexOf(d);
    const prev = navDocs[i - 1], next = navDocs[i + 1];
    main.innerHTML = `
      <div class="crumbs"><span>${esc(d.group)}</span><span aria-hidden="true">›</span><span class="badge ${d.status.key}">${esc(d.status.label)}</span><code>marketing/${esc(d.rel)}</code></div>
      <article class="doc">${d.html}</article>
      <nav class="pager" aria-label="Documento anterior e próximo">
        ${prev ? `<a href="#${prev.id}"><small>Anterior</small>${esc(prev.title)}</a>` : "<span></span>"}
        ${next ? `<a class="next" href="#${next.id}"><small>Próximo</small>${esc(next.title)}</a>` : ""}
      </nav>`;
    decorate(main);
    highlight(main.querySelector(".doc"), term);
  }

  function viewPend() {
    const hide = store.get("mk-hide-done") === "1";
    const list = [home, ...navDocs].filter((d) => d.pend.length);
    const total = pendTotal(), done = pendDone();
    main.innerHTML = `
      <div class="doc"><h1>Pendências</h1>
      <p>Tudo que os documentos marcam como <strong class="st-adefinir">A definir</strong>, mais os itens das seções de decisões em aberto. Marque o que já foi resolvido: a marcação fica salva só neste navegador. Para valer para todos, atualize o <code>.md</code>.</p></div>
      <div class="toolbar">
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" aria-label="Pendências resolvidas"><i style="width:${total ? (done / total) * 100 : 0}%"></i></div>
        <span>${done} de ${total} marcadas</span>
        <label><input type="checkbox" id="hide" ${hide ? "checked" : ""}> Esconder marcadas</label>
      </div>
      ${list.map((d) => `
        <section class="pgroup">
          <h2><a href="#${d.id}">${esc(d.title)}</a><span class="badge ${d.status.key}">${esc(d.status.label)}</span></h2>
          ${d.pend.map((t) => {
            const k = pendKey(d, t), on = store.get(k) === "1";
            if (on && hide) return "";
            return `<label class="pitem ${on ? "done" : ""}"><input type="checkbox" data-k="${k}" ${on ? "checked" : ""}><span>${t}</span></label>`;
          }).join("")}
        </section>`).join("")}`;
    main.querySelectorAll("input[data-k]").forEach((c) => c.addEventListener("change", () => {
      store.set(c.dataset.k, c.checked ? "1" : "0");
      viewPend(); updateCount();
    }));
    main.querySelector("#hide").addEventListener("change", (e) => { store.set("mk-hide-done", e.target.checked ? "1" : "0"); viewPend(); });
    decorate(main);
  }

  function viewSearch(term) {
    const terms = term.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = docs.filter((d) => terms.every((t) => (d.title + " " + d.text).toLowerCase().includes(t)));
    main.innerHTML = `<div class="doc"><h1>Busca: “${esc(term)}”</h1></div>` + (hits.length
      ? hits.map((d) => {
          const low = d.text.toLowerCase(), at = Math.max(0, low.indexOf(terms[0]) - 70);
          const snip = esc(d.text.slice(at, at + 200)).replace(new RegExp(esc(terms[0]).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
          return `<a class="result" href="#${d.id === "README" ? "inicio" : d.id}"><b>${esc(d.title)}</b> <span class="badge ${d.status.key}">${esc(d.status.label)}</span><p>…${snip}…</p></a>`;
        }).join("")
      : `<p class="empty">Nada encontrado. Tente outra palavra.</p>`);
  }

  function simulador(el) {
    const saved = (() => { try { return JSON.parse(store.get("mk-sim") || "null"); } catch { return null; } })();
    const s = Object.assign({ unidades: 5, alunos: 500, preco: 6, prazo: "anual", desc: { mensal: 0, trimestral: 0, semestral: 0, anual: 0 }, minimo: 0, custo: 0.21, eventos: 6 }, saved || {});
    const MESES = { mensal: 1, trimestral: 3, semestral: 6, anual: 12 };
    const NOME = { mensal: "Por mês (até 3 meses)", trimestral: "Por trimestre", semestral: "Por semestre", anual: "Por ano" };
    el.innerHTML = `
      <div class="sim">
        <h4>Simulador de proposta</h4>
        <div class="sim-in">
          <label>Unidades da rede<input type="number" min="1" step="1" data-f="unidades"></label>
          <label>Alunos por unidade (média)<input type="number" min="1" step="10" data-f="alunos"></label>
          <label>Preço por aluno por mês (R$)<input type="number" min="0" step="0.5" data-f="preco"></label>
          <label>Prazo do contrato<select data-f="prazo">${Object.keys(MESES).map((k) => `<option value="${k}">${k[0].toUpperCase() + k.slice(1)}</option>`).join("")}</select></label>
          <label>Desconto do prazo (%)<input type="number" min="0" max="90" step="1" data-f="desc"><small>Percentual ainda a definir</small></label>
          <label>Mínimo por unidade por mês (R$)<input type="number" min="0" step="50" data-f="minimo"><small>A definir; 0 desliga</small></label>
          <label>Custo por aluno por mês (R$)<input type="number" min="0" step="0.01" data-f="custo"><small>Estimativa: R$ 0,11 a R$ 1,80</small></label>
          <label>Eventos com foto por ano<input type="number" min="1" step="1" data-f="eventos"></label>
        </div>
        <div class="sim-out" aria-live="polite"></div>
        <p class="note">Margem antes de imposto e custo de pessoas. O custo padrão de R$ 0,21 é o cenário "Tração" (10 escolas, 3.000 alunos) da estimativa de custos de 21/09/2026, sem conta real de cobrança. Os valores ficam salvos só neste navegador.</p>
      </div>`;
    const out = el.querySelector(".sim-out");
    const inputs = el.querySelectorAll("[data-f]");
    const fill = () => inputs.forEach((i) => { i.value = i.dataset.f === "desc" ? s.desc[s.prazo] : s[i.dataset.f]; });
    const calc = () => {
      const alunos = s.unidades * s.alunos;
      const desc = Math.min(Math.max(s.desc[s.prazo] || 0, 0), 90) / 100;
      const porUnidade = Math.max(s.alunos * s.preco * (1 - desc), s.minimo || 0);
      const mensal = porUnidade * s.unidades;
      const custo = alunos * s.custo;
      const margem = mensal > 0 ? (mensal - custo) / mensal : 0;
      const porEvento = alunos && s.eventos ? (mensal * 12) / alunos / s.eventos : 0;
      out.innerHTML = [
        ["Alunos na rede", num.format(alunos)],
        ["Por unidade por mês", brl.format(porUnidade)],
        ["Rede por mês", brl.format(mensal), true],
        ...(s.prazo === "anual" ? [] : [[NOME[s.prazo], brl.format(mensal * MESES[s.prazo])]]),
        ["Rede por ano", brl.format(mensal * 12)],
        ["Por aluno por evento", brl.format(porEvento)],
        ["Custo estimado por mês", brl.format(custo)],
        ["Margem bruta", (margem * 100).toFixed(0) + "%"],
      ].map(([k, v, hl]) => `<div class="out${hl ? " hl" : ""}"><span>${k}</span><b>${v}</b></div>`).join("");
      store.set("mk-sim", JSON.stringify(s));
    };
    inputs.forEach((i) => i.addEventListener("input", () => {
      const f = i.dataset.f;
      if (f === "prazo") { s.prazo = i.value; fill(); }
      else if (f === "desc") s.desc[s.prazo] = Number(i.value) || 0;
      else s[f] = Number(i.value) || 0;
      calc();
    }));
    fill(); calc();
  }

  function route() {
    const id = current;
    const term = q.value.trim();
    if (id === "busca" && term) viewSearch(term);
    else if (id === "pendencias") viewPend();
    else if (byId[id] && byId[id] !== home) viewDoc(byId[id], term);
    else viewHome();
    markCurrent();
    side.classList.remove("open"); menu.setAttribute("aria-expanded", "false");
    if (!(id === "busca")) window.scrollTo(0, 0);
  }

  let t;
  q.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (q.value.trim()) { current === "busca" ? route() : go("busca"); }
      else if (current === "busca") go("inicio");
    }, 180);
  });
  buildNav();
  route();
})();
</script>
</body>
</html>
